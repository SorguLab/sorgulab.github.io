const TAHMINLER = [
  { id: 't01', dil: 'sql', konu: 'NULL & aggregate', kod: "WITH t(x) AS (VALUES (1), (2), (NULL), (2))\nSELECT AVG(x) AS ortalama FROM t;", soru: '<code>ortalama</code> kaç çıkar?',
    secenekler: ['1.25', '1.67', '1.5', 'NULL'], dogru: 1,
    aciklama: '<p>Aggregate fonksiyonlar (<code>COUNT(*)</code> hariç) NULL\'ları yok sayar. AVG = (1 + 2 + 2) / 3 = 1.67. NULL\'ı 0 kabul etseydi 5 / 4 = 1.25 olurdu.</p><p>NULL\'ı 0 saymak istiyorsan: <code>AVG(COALESCE(x, 0))</code>.</p>' },
  { id: 't02', dil: 'sql', konu: 'NULL', kod: 'SELECT NULL = NULL AS sonuc;', soru: '<code>sonuc</code> ne olur?',
    secenekler: ['1 (TRUE)', '0 (FALSE)', 'NULL', 'Hata verir'], dogru: 2,
    aciklama: '<p>NULL "bilinmeyen" demek. İki bilinmeyenin eşit olup olmadığı da bilinmez, sonuç NULL olur. Bu yüzden <code>IS NULL</code> kullanılır.</p>' },
  { id: 't03', dil: 'sql', konu: 'JOIN', kod: "WITH a(id) AS (VALUES (1), (2), (3)),\n     b(id) AS (VALUES (1), (1), (4))\nSELECT * FROM a LEFT JOIN b ON a.id = b.id;", soru: 'Kaç satır döner?',
    secenekler: ['3', '4', '5', '2'], dogru: 1,
    aciklama: '<p>a\'daki 1, b\'deki iki tane 1 ile eşleşir ve <b>2 satır</b> üretir. 2 ve 3 eşleşmez ama LEFT JOIN onları NULL ile tutar (+2). Toplam 4.</p><p>Ders: anahtar tekrarlıyorsa JOIN satır sayısını artırır (fan-out). "LEFT JOIN sol tablonun satır sayısını korur" bilgisi yanlış bir genellemedir.</p>' },
  { id: 't04', dil: 'sql', konu: 'JOIN', kod: "WITH a(id) AS (VALUES (1), (2), (3)),\n     b(id) AS (VALUES (1), (1), (4))\nSELECT * FROM a INNER JOIN b ON a.id = b.id;", soru: 'Kaç satır döner?',
    secenekler: ['1', '2', '3', '4'], dogru: 1,
    aciklama: '<p>Sadece eşleşenler gelir: a.1 × b.1 iki kez eşleşir, sonuç <b>2 satır</b>. 2, 3 ve 4 hiçbir satırla eşleşmez.</p>' },
  { id: 't05', dil: 'sql', konu: 'WHERE vs HAVING', kod: "WITH t(k, v) AS (VALUES ('a',1), ('a',5), ('b',2), ('b',2), ('c',9))\nSELECT k, SUM(v) AS toplam\nFROM t\nWHERE v > 1\nGROUP BY k\nHAVING SUM(v) > 4;", soru: 'Kaç satır döner?',
    secenekler: ['1', '2', '3', '0'], dogru: 1,
    aciklama: '<p>Önce WHERE: v=1 satırı elenir. Kalan toplamlar a=5, b=4, c=9. Sonra HAVING &gt; 4: <b>a ve c</b> kalır, yani 2 satır.</p><p>WHERE olmasaydı a=6 olurdu ve yine geçerdi. Burada asıl fark b\'de: 4, 4\'ten büyük olmadığı için elenir.</p>' },
  { id: 't06', dil: 'sql', konu: 'Window', kod: "WITH t(v) AS (VALUES (10), (20), (20), (30))\nSELECT v,\n       RANK()       OVER (ORDER BY v DESC) AS r,\n       DENSE_RANK() OVER (ORDER BY v DESC) AS dr\nFROM t;", soru: 'v = 10 olan satırda <code>r</code> (RANK) kaçtır?',
    secenekler: ['3', '4', '2', '5'], dogru: 1,
    aciklama: '<p>Azalan sırada 30 → 1, iki tane 20 → 2 ve 2. RANK eşitlikten sonra boşluk bırakır, 10 → <b>4</b>. DENSE_RANK boşluk bırakmaz, orada 10 → 3 olurdu.</p>' },
  { id: 't07', dil: 'sql', konu: 'Tip dönüşümü', kod: 'SELECT 7 / 2 AS sonuc;', soru: 'SQLite\'ta <code>sonuc</code> kaç olur?',
    secenekler: ['3.5', '3', '4', 'Hata'], dogru: 1,
    aciklama: '<p>SQLite (ve SQL Server, PostgreSQL) iki tam sayıyı bölünce tam sayı döner, ondalık kısım atılır: <b>3</b>. Ondalık için <code>7.0 / 2</code> ya da <code>CAST(7 AS REAL) / 2</code>.</p>' },
  { id: 't08', dil: 'sql', konu: 'NULL', kod: "SELECT COALESCE(NULL, '', 'x') AS sonuc;", soru: '<code>sonuc</code> nedir?',
    secenekler: ["'x'", "'' (boş metin)", 'NULL', 'Hata'], dogru: 1,
    aciklama: '<p><code>COALESCE</code> soldan başlayıp NULL olmayan <b>ilk</b> değeri döner. Boş metin <code>\'\'</code> NULL değildir, bu yüzden sonuç boş metin.</p><p>Gerçek verideki tuzak: Excel\'den gelen veride "boş" hücreler bazen NULL, bazen \'\' olur. İkisini birden yakalamak için <code>NULLIF(sutun, \'\')</code>.</p>' },
  { id: 't09', dil: 'sql', konu: 'Küme işlemleri', kod: "WITH a(x) AS (VALUES (1), (2), (2)),\n     b(x) AS (VALUES (2), (3))\nSELECT x FROM a\nUNION\nSELECT x FROM b;", soru: 'Kaç satır döner?',
    secenekler: ['5', '3', '4', '2'], dogru: 1,
    aciklama: '<p><code>UNION</code> birleştirip tekrarları atar: {1, 2, 3} = <b>3 satır</b>. <code>UNION ALL</code> tekrarları tutardı (5 satır).</p><p>UNION ALL daha hızlıdır çünkü tekrar kontrolü (sıralama/hash) yapmaz. Tekrar olmayacağını biliyorsan onu tercih et.</p>' },
  { id: 't10', dil: 'sql', konu: 'CASE & NULL', kod: "SELECT CASE WHEN NULL THEN 'a' ELSE 'b' END AS sonuc;", soru: '<code>sonuc</code> nedir?',
    secenekler: ["'a'", "'b'", 'NULL', 'Hata'], dogru: 1,
    aciklama: '<p>CASE sadece koşul TRUE olduğunda o dalı seçer. NULL, TRUE değildir, bu yüzden ELSE\'e düşer: <b>\'b\'</b>.</p>' },
  { id: 't11', dil: 'sql', konu: 'COUNT', kod: "WITH t(x) AS (VALUES (1), (NULL), (1), (NULL))\nSELECT COUNT(*) AS a, COUNT(x) AS b, COUNT(DISTINCT x) AS c FROM t;", soru: '<code>a, b, c</code> sırasıyla?',
    secenekler: ['4, 4, 2', '4, 2, 1', '4, 2, 2', '2, 2, 1'], dogru: 1,
    aciklama: '<p><code>COUNT(*)</code> tüm satırlar: 4. <code>COUNT(x)</code> NULL olmayanlar: 2. <code>COUNT(DISTINCT x)</code> NULL olmayan tekrarsız değerler: sadece {1}, yani 1.</p>' },
  { id: 't12', dil: 'python', konu: 'NaN', kod: 'import pandas as pd\nsonuc = pd.Series([1, 2, None, 2]).mean()', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['1.25', '1.67', 'nan', 'Hata'], dogru: 1,
    aciklama: '<p>pandas istatistik fonksiyonları varsayılan olarak <code>skipna=True</code> çalışır, NaN\'ları yok sayar: 5 / 3 = 1.67. SQL\'deki AVG ile aynı davranış.</p><p>NumPy\'da ise <code>np.mean([1, 2, np.nan, 2])</code> nan döner, orada <code>np.nanmean</code> gerekir.</p>' },
  { id: 't13', dil: 'python', konu: 'loc vs iloc', kod: 'import pandas as pd\ndf = pd.DataFrame({"a": [10, 20, 30, 40, 50]})\nsonuc = len(df.loc[0:2])', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['2', '3', '5', 'Hata'], dogru: 1,
    aciklama: '<p><code>loc</code> etiket bazlıdır ve dilimlemede <b>bitiş dahildir</b>: 0, 1, 2 etiketleri → 3 satır. <code>iloc[0:2]</code> ise Python dilimlemesi gibi bitişi hariç tutar ve 2 satır döner.</p>' },
  { id: 't14', dil: 'python', konu: 'merge', kod: 'import pandas as pd\na = pd.DataFrame({"id": [1, 2, 3]})\nb = pd.DataFrame({"id": [1, 1, 4], "v": ["x", "y", "z"]})\nsonuc = len(a.merge(b, on="id", how="left"))', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['3', '4', '5', '6'], dogru: 1,
    aciklama: '<p>SQL\'deki LEFT JOIN ile aynı: id=1 iki kez eşleşir (2 satır), 2 ve 3 NaN ile kalır (2 satır). Toplam 4.</p><p>Fan-out\'u önlemek için <code>a.merge(b, on="id", validate="one_to_one")</code> yazabilirsin. Beklenmeyen tekrar varsa pandas hata verir.</p>' },
  { id: 't15', dil: 'python', konu: 'groupby', kod: 'import pandas as pd\ndf = pd.DataFrame({"k": ["a", "a", "b"], "v": [1, None, 3]})\nsonuc = df.groupby("k")["v"].count()["a"]', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['2', '1', '0', 'nan'], dogru: 1,
    aciklama: '<p><code>count()</code> NaN olmayan değerleri sayar: a grubunda bir değer NaN olduğu için sonuç 1. Satır sayısını istersen <code>size()</code> kullanırsın, o 2 döner.</p>' },
  { id: 't16', dil: 'python', konu: 'rank', kod: 'import pandas as pd\ns = pd.Series([10, 20, 20, 30])\nsonuc = s.rank(method="dense", ascending=False).iloc[0]', soru: '10 değerinin sırası (<code>sonuc</code>) kaçtır?',
    secenekler: ['4.0', '3.0', '1.0', '2.5'], dogru: 1,
    aciklama: '<p>Azalan dense rank: 30 → 1, 20 → 2, 20 → 2, 10 → <b>3</b>. <code>method="min"</code> olsaydı 4 olurdu (SQL RANK), varsayılan <code>"average"</code> ise eşitlere ortalama sıra verir (20\'ler için 2.5).</p>' },
  { id: 't17', dil: 'python', konu: 'Python temelleri', kod: 'a = [1, 2, 3]\nb = a\nb.append(4)\nsonuc = len(a)', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['3', '4', 'Hata', '1'], dogru: 1,
    aciklama: '<p><code>b = a</code> listeyi kopyalamaz, aynı nesneye ikinci bir isim verir. b\'ye eklenen eleman a\'da da görünür: 4.</p><p>Kopya için <code>a.copy()</code> ya da <code>list(a)</code>. pandas\'ta da aynı mantık geçerli: <code>df2 = df</code> kopya değildir, <code>df.copy()</code> gerekir.</p>' },
  { id: 't18', dil: 'python', konu: 'NumPy · liste vs dizi', kod: 'import numpy as np\nliste = [1, 2, 3] * 2\ndizi = np.array([1, 2, 3]) * 2\nsonuc = (len(liste), len(dizi))', soru: '<code>sonuc</code> nedir?',
    secenekler: ['(3, 3)', '(6, 3)', '(6, 6)', '(3, 6)'], dogru: 1,
    aciklama: '<p>Python listesinde <code>* 2</code> listeyi <b>tekrarlar</b>: [1, 2, 3, 1, 2, 3], yani 6 eleman. NumPy dizisinde ise her elemanı 2 ile <b>çarpar</b>: [2, 4, 6], yani boy değişmez.</p><p><code>+</code> operatörü de aynı şekilde farklı davranır: listelerde uç uca ekler, dizilerde eleman eleman toplar.</p>' },
  { id: 't19', dil: 'python', konu: 'NumPy · axis', kod: 'import numpy as np\na = np.array([[1, 2, 3],\n              [4, 5, 6]])\nsonuc = a.sum(axis=0)', soru: '<code>sonuc</code> nedir?',
    secenekler: ['[6, 15]', '[5, 7, 9]', '21', '[1, 2, 3, 4, 5, 6]'], dogru: 1,
    aciklama: '<p><code>axis=0</code> satır boyutunu "ezer": her sütundaki değerler alt alta toplanır. 1+4, 2+5, 3+6 = [5, 7, 9]. <code>axis=1</code> olsaydı her satır kendi içinde toplanırdı: [6, 15]. axis verilmeseydi tek bir sayı: 21.</p>' },
  { id: 't20', dil: 'python', konu: 'NumPy · view vs copy', kod: 'import numpy as np\na = np.array([10, 20, 30, 40])\nb = a[:2]\nb[0] = 99\nsonuc = a[0]', soru: '<code>sonuc</code> kaçtır?',
    secenekler: ['10', '99', 'Hata', '20'], dogru: 1,
    aciklama: '<p>NumPy\'da dilimleme (slicing) yeni bir dizi kopyalamaz, aynı belleğe bakan bir <b>görünüm</b> (view) döner. b\'yi değiştirmek a\'yı da değiştirir. Bağımsız bir kopya için <code>a[:2].copy()</code> yazılır.</p><p>Python listelerinde ise dilimleme kopya üretir. pandas\'taki <code>SettingWithCopyWarning</code> uyarısının kökü de bu davranış.</p>' },
  { id: 't21', dil: 'python', konu: 'NumPy · NaN', kod: 'import numpy as np\nsonuc = np.array([1, 2, np.nan]).sum()', soru: '<code>sonuc</code> nedir?',
    secenekler: ['3.0', 'nan', '0', 'Hata'], dogru: 1,
    aciklama: '<p>NumPy\'da NaN "bulaşıcıdır": NaN içeren her toplama, ortalama vb. sonuçta NaN verir. NaN\'ları atlamak için <code>np.nansum</code>, <code>np.nanmean</code> kullanılır.</p><p>pandas ise varsayılan olarak NaN\'ları atlar: <code>pd.Series([1, 2, np.nan]).sum()</code> = 3.0. İki kütüphane arasındaki en sık karışıklıklardan biri.</p>' },
  { id: 't22', dil: 'python', konu: 'NumPy · broadcasting', kod: 'import numpy as np\na = np.ones((3, 1))\nb = np.ones((1, 4))\nsonuc = (a + b).shape', soru: '<code>sonuc</code> nedir?',
    secenekler: ['Hata (boyutlar uyuşmuyor)', '(3, 4)', '(3, 1)', '(1, 4)'], dogru: 1,
    aciklama: '<p>Broadcasting kuralı: iki dizinin boyutları sondan başlayarak karşılaştırılır. Her boyut ya eşit olmalı ya da biri 1 olmalı. 1 olan boyut diğerinin boyuna "yayılır".</p><p>(3, 1) ile (1, 4): son boyut 1 ve 4 → 4, ilk boyut 3 ve 1 → 3. Sonuç (3, 4). (3, 2) ile (4, 2) olsaydı ilk boyut 3 ve 4 uyuşmaz ve hata verirdi.</p>' },
  { id: 't23', dil: 'python', konu: 'NumPy · std ve ddof', kod: 'import numpy as np\nimport pandas as pd\nveri = [2, 4, 4, 4, 5, 5, 7, 9]\nsonuc = (np.std(veri), round(pd.Series(veri).std(), 2))', soru: '<code>sonuc</code> nedir?',
    secenekler: ['(2.0, 2.0)', '(2.0, 2.14)', '(2.14, 2.0)', '(2.14, 2.14)'], dogru: 1,
    aciklama: '<p><code>np.std</code> varsayılan olarak <code>ddof=0</code> kullanır ve n\'e böler (popülasyon std): 2.0. pandas <code>.std()</code> varsayılan olarak <code>ddof=1</code> kullanır ve n−1\'e böler (örneklem std): 2.14.</p><p>Aynı veriden farklı sonuç almanın klasik sebebi bu. Mülakatta "neden n−1?" diye sorulursa: örneklemden popülasyon varyansını tahmin ederken yanlılığı (bias) düzeltmek için (Bessel düzeltmesi).</p>' }

    aciklama: '<p>CASE koşulları sırayla kontrol eder ve ilk doğru olanda durur. <code>Age &lt; 40</code>\'a ulaşan biri zaten 30 ve üzeridir, alt sınırı tekrar yazmaya gerek yok.</p><p>Gençlerde attrition belirgin şekilde yüksek. Kariyerin başındaki çalışanların daha sık iş değiştirmesiyle uyumlu bir tablo.</p>' },
  { id: 'h12', dil: 'sql', seviye: 2, kategori: 'JOIN', baslik: 'Eğitim seviyesine göre maaş', sirali: true,
    soru: '<code>hr</code> tablosunu <code>egitim_kod</code> ile birleştirip her eğitim seviyesi için çalışan sayısını (<code>calisan</code>) ve ortalama aylık geliri (<code>ort_gelir</code>, 2 ondalık) bul. Sütunlar: <code>egitim_adi</code>, <code>calisan</code>, <code>ort_gelir</code>. Eğitim koduna göre (1\'den 5\'e) sırala.',
    ipucu: '<code>JOIN egitim_kod e ON h.Education = e.Education</code>. Sıralamayı etikete göre değil koda göre yap.',
    cozum: 'SELECT e.egitim_adi,\n       COUNT(*) AS calisan,\n       ROUND(AVG(h.MonthlyIncome), 2) AS ort_gelir\nFROM hr h\nJOIN egitim_kod e ON h.Education = e.Education\nGROUP BY e.Education, e.egitim_adi\nORDER BY e.Education;',
    aciklama: '<p>Kod tabloları (lookup) veriyi sayısal kodla saklayıp anlamını ayrı tutar. Bu, gerçek veritabanlarında çok yaygın bir yapı.</p><p>GROUP BY\'a hem kodu hem etiketi koyduk, çünkü sıralamayı koda göre yapıyoruz. Etikete göre sıralasaydık alfabetik olurdu: Bachelor, Below College, College… Bu da mantıksal sırayı bozardı.</p>' },
  { id: 'h13', dil: 'sql', seviye: 2, kategori: 'JOIN', baslik: 'İş memnuniyeti ve attrition', sirali: true,
    soru: 'İş memnuniyeti (<code>JobSatisfaction</code>) etiketine göre çalışan sayısını (<code>calisan</code>) ve attrition oranını (<code>oran</code>, %, 2 ondalık) bul. Etiketler <code>memnuniyet_kod</code> tablosunda. Sütunlar: <code>etiket</code>, <code>calisan</code>, <code>oran</code>. Puana göre (Low → Very High) sırala.',
    ipucu: '<code>JOIN memnuniyet_kod m ON h.JobSatisfaction = m.puan</code>',
    cozum: "SELECT m.etiket,\n       COUNT(*) AS calisan,\n       ROUND(100.0 * AVG(CASE WHEN h.Attrition = 'Yes' THEN 1 ELSE 0 END), 2) AS oran\nFROM hr h\nJOIN memnuniyet_kod m ON h.JobSatisfaction = m.puan\nGROUP BY m.puan, m.etiket\nORDER BY m.puan;",
    aciklama: '<p>Aynı <code>memnuniyet_kod</code> tablosu birden fazla sütun için kullanılabilir: JobSatisfaction, EnvironmentSatisfaction, RelationshipSatisfaction. Bu yüzden JOIN anahtarının adı (<code>puan</code>) sütunlardan farklı.</p><p>Attrition en yüksek "Low" grubunda, en düşük "Very High" grubunda. Medium ve High ise neredeyse aynı. Yani ilişki düz bir çizgi değil, asıl fark uçlarda. Sayıya bakmadan "memnuniyet düştükçe ayrılma artar" demek fazla basitleştirme olurdu.</p>' },

  // ───────────── SQL · ZOR ─────────────
  { id: 'h14', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Departmanın en iyi kazanan 3 kişisi',
    soru: 'Her departmanda aylık geliri en yüksek 3 çalışanı bul. Eşitlik olursa küçük <code>EmployeeNumber</code> önce gelsin. Sütunlar: <code>Department</code>, <code>EmployeeNumber</code>, <code>JobRole</code>, <code>MonthlyIncome</code>, <code>sira</code>.',
    ipucu: '<code>ROW_NUMBER() OVER (PARTITION BY Department ORDER BY MonthlyIncome DESC, EmployeeNumber)</code>, sonra dış sorguda <code>sira &lt;= 3</code>.',
    cozum: 'WITH sirali AS (\n  SELECT Department, EmployeeNumber, JobRole, MonthlyIncome,\n         ROW_NUMBER() OVER (PARTITION BY Department\n                            ORDER BY MonthlyIncome DESC, EmployeeNumber) AS sira\n  FROM hr\n)\nSELECT Department, EmployeeNumber, JobRole, MonthlyIncome, sira\nFROM sirali\nWHERE sira <= 3;',
    aciklama: '<p>"Her grubun ilk N\'i" kalıbı: önce grup içinde numara ver, sonra filtrele. Window fonksiyonları WHERE\'den sonra hesaplandığı için filtre bir dış sorguda (CTE) yapılır.</p><p><code>PARTITION BY</code> numaralandırmanın her departmanda 1\'den başlamasını sağlar. ORDER BY\'daki <code>EmployeeNumber</code> eşitliği bozar ve sonucu her çalıştırmada aynı tutar.</p>' },
  { id: 'h15', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Rol ortalamasının çok altında kazananlar',
    soru: 'Kendi rolünün (<code>JobRole</code>) ortalama gelirinin %60\'ından az kazanan çalışanları bul. Sütunlar: <code>EmployeeNumber</code>, <code>JobRole</code>, <code>MonthlyIncome</code>, <code>rol_ortalamasi</code> (2 ondalık).',
    ipucu: '<code>AVG(MonthlyIncome) OVER (PARTITION BY JobRole)</code> her satıra rolün ortalamasını ekler.',
    cozum: 'WITH t AS (\n  SELECT EmployeeNumber, JobRole, MonthlyIncome,\n         AVG(MonthlyIncome) OVER (PARTITION BY JobRole) AS rol_ort\n  FROM hr\n)\nSELECT EmployeeNumber, JobRole, MonthlyIncome,\n       ROUND(rol_ort, 2) AS rol_ortalamasi\nFROM t\nWHERE MonthlyIncome < 0.6 * rol_ort;',
    aciklama: '<p>GROUP BY satırları birleştirirdi ve çalışan detayını kaybederdik. Window function ise her satırı korur ve yanına grup ortalamasını ekler. "Grup ortalamasıyla karşılaştır" sorularının standart çözümü bu.</p><p>Alternatif: rol ortalamalarını bir CTE\'de GROUP BY ile hesaplayıp ana tabloyla JOIN etmek. Sonuç aynı, sadece biraz daha uzun.</p>' },
  { id: 'h16', dil: 'sql', seviye: 3, kategori: 'CASE WHEN', baslik: 'Ayrılan ve kalanların maaşı yan yana', sirali: true,
    soru: 'Her departman için kalanların (<code>kalan_ort</code>) ve ayrılanların (<code>ayrilan_ort</code>) ortalama aylık gelirini yan yana göster, aradaki farkı da ekle (<code>fark</code> = kalan − ayrılan). Hepsi 2 ondalık. Departman adına göre sırala.',
    ipucu: '<code>AVG(CASE WHEN Attrition = \'No\' THEN MonthlyIncome END)</code>: ELSE yazmazsan diğer satırlar NULL olur ve AVG onları yok sayar.',
    cozum: "SELECT Department,\n       ROUND(AVG(CASE WHEN Attrition = 'No'  THEN MonthlyIncome END), 2) AS kalan_ort,\n       ROUND(AVG(CASE WHEN Attrition = 'Yes' THEN MonthlyIncome END), 2) AS ayrilan_ort,\n       ROUND(AVG(CASE WHEN Attrition = 'No'  THEN MonthlyIncome END)\n           - AVG(CASE WHEN Attrition = 'Yes' THEN MonthlyIncome END), 2) AS fark\nFROM hr\nGROUP BY Department\nORDER BY Department;",
    aciklama: '<p>SQL\'de pivot yapmanın yolu bu: her sütun için ayrı bir koşullu aggregate.</p><p>Kritik nokta <b>ELSE yazmamak</b>. <code>ELSE 0</code> yazsaydın diğer gruptaki satırlar 0 olarak ortalamaya girer ve sonuç çok düşük çıkardı. ELSE yokken o satırlar NULL olur, AVG de NULL\'ları atlar.</p>' },
  { id: 'h17', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Kıdeme göre kümülatif ayrılma', sirali: true,
    soru: 'Ayrılan çalışanları şirkette geçirdikleri yıla (<code>YearsAtCompany</code>) göre grupla. Her yıl için ayrılan sayısını (<code>ayrilan</code>) ve ayrılanların kümülatif yüzdesini (<code>kumulatif_yuzde</code>, 2 ondalık) bul. Örneğin 2. yıl satırı, ilk 0-2 yılda ayrılanların tüm ayrılanlara oranını gösterir. Yıla göre sırala.',
    ipucu: 'Önce yıl bazında say (CTE). Sonra <code>SUM(ayrilan) OVER (ORDER BY YearsAtCompany)</code> / <code>SUM(ayrilan) OVER ()</code>.',
    cozum: "WITH yillik AS (\n  SELECT YearsAtCompany, COUNT(*) AS ayrilan\n  FROM hr\n  WHERE Attrition = 'Yes'\n  GROUP BY YearsAtCompany\n)\nSELECT YearsAtCompany, ayrilan,\n       ROUND(100.0 * SUM(ayrilan) OVER (ORDER BY YearsAtCompany)\n             / SUM(ayrilan) OVER (), 2) AS kumulatif_yuzde\nFROM yillik\nORDER BY YearsAtCompany;",
    aciklama: '<p>İki farklı window çerçevesi kullanılıyor:</p><ul><li><code>OVER (ORDER BY ...)</code>: baştan bu satıra kadar toplam (kümülatif)</li><li><code>OVER ()</code>: boş parantez, tüm tablonun toplamı</li></ul><p>Sonuca göre ayrılanların yarısından fazlası şirketteki ilk 4 yılı (0-3) dolmadan gidiyor. En büyük sıçrama 1. yılda. İK açısından bu, onboarding ve ilk yılların ne kadar kritik olduğunu gösteren tipik bir bulgu.</p>' },
  { id: 'h18', dil: 'sql', seviye: 3, kategori: 'Subquery / CTE', baslik: 'Rollerin şirket ortalamasından sapması', sirali: true,
    soru: 'Her iş rolü için attrition oranını (<code>oran</code>), şirket genel oranını (<code>genel_oran</code>) ve aradaki farkı (<code>fark</code> = oran − genel_oran) yüzde puan olarak bul. Hepsi 2 ondalık. Farkı en büyük rol en üstte olsun.',
    ipucu: 'Genel oranı skaler bir alt sorguyla ya da CTE ile hesapla.',
    cozum: "WITH genel AS (\n  SELECT 100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS g\n  FROM hr\n), rol AS (\n  SELECT JobRole, 100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS o\n  FROM hr\n  GROUP BY JobRole\n)\nSELECT r.JobRole,\n       ROUND(r.o, 2) AS oran,\n       ROUND(g.g, 2) AS genel_oran,\n       ROUND(r.o - g.g, 2) AS fark\nFROM rol r\nCROSS JOIN genel g\nORDER BY fark DESC;",
    aciklama: '<p><code>genel</code> CTE\'si tek satır döner. <code>CROSS JOIN</code> bu satırı her rol satırına ekler. Tek satırlık tabloyla CROSS JOIN, bir sabiti her satıra taşımanın temiz yolu.</p><p>Alternatif: <code>AVG(...) OVER ()</code> ile window kullanmak. Ama rol bazında GROUP BY yapılmışken window, şirket ortalamasını değil rollerin ortalamasının ortalamasını verir. Bu ince farka dikkat.</p>' },
  { id: 'h19', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Maaş çeyreklerinde attrition', sirali: true,
    soru: 'Çalışanları aylık gelire göre 4 eşit gruba (çeyrek) böl. Eşit maaşlarda küçük <code>EmployeeNumber</code> önce gelsin. Her çeyrek için en düşük (<code>min_gelir</code>) ve en yüksek geliri (<code>max_gelir</code>) ve attrition oranını (<code>oran</code>, %, 2 ondalık) bul. Sütunlar: <code>ceyrek</code>, <code>min_gelir</code>, <code>max_gelir</code>, <code>oran</code>.',
    ipucu: '<code>NTILE(4) OVER (ORDER BY MonthlyIncome, EmployeeNumber)</code>',
    cozum: "WITH c AS (\n  SELECT MonthlyIncome, Attrition,\n         NTILE(4) OVER (ORDER BY MonthlyIncome, EmployeeNumber) AS ceyrek\n  FROM hr\n)\nSELECT ceyrek,\n       MIN(MonthlyIncome) AS min_gelir,\n       MAX(MonthlyIncome) AS max_gelir,\n       ROUND(100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END), 2) AS oran\nFROM c\nGROUP BY ceyrek\nORDER BY ceyrek;",
    aciklama: '<p><code>NTILE(n)</code> sıralı satırları n eşit gruba böler. pandas\'taki <code>qcut</code> ile aynı fikir.</p><p>Tie-breaker (<code>EmployeeNumber</code>) olmadan, sınırda aynı maaşa sahip kişilerin hangi çeyreğe düşeceği belirsiz olurdu.</p><p>En düşük gelir çeyreğinde attrition belirgin şekilde yüksek, sonraki çeyreklerde düşüyor.</p>' },

  // ───────────── PYTHON · KOLAY ─────────────
  { id: 'k01', dil: 'python', seviye: 1, kategori: 'Veri Kalitesi', baslik: 'Tek değerli sütunlar',
    soru: '<code>hr</code> tablosunda tüm satırlarda aynı değere sahip (yani analiz için bilgi taşımayan) sütunların adlarını <code>sonuc</code>\'a ata.',
    ipucu: '<code>nunique()</code> her sütundaki farklı değer sayısını verir.',
    cozum: 'tekil = hr.nunique()\nsonuc = list(tekil[tekil == 1].index)',
    aciklama: '<p><code>hr.nunique()</code> her sütun için farklı değer sayısını döner. 1 olanlar sabit sütunlardır: EmployeeCount (hep 1), Over18 (hep Y), StandardHours (hep 80).</p><p>Bu sütunlar modelde ya da analizde işe yaramaz. Keşif aşamasında tespit edip <code>hr.drop(columns=...)</code> ile atmak standart bir veri temizleme adımı.</p>' },
  { id: 'k02', dil: 'python', seviye: 1, kategori: 'pandas Temelleri', baslik: 'Attrition dağılımı',
    soru: '<code>Attrition</code> sütunundaki Yes/No dağılımını <b>oran</b> olarak (0-1 arası) <code>sonuc</code>\'a ata.',
    ipucu: '<code>value_counts</code>\'un oran veren bir parametresi var.',
    cozum: 'sonuc = hr["Attrition"].value_counts(normalize=True)',
    aciklama: '<p><code>normalize=True</code> sayılar yerine oranları verir. Yüzde için 100 ile çarpabilirsin.</p><p>%84\'e %16 dağılım, veri setinin <b>dengesiz</b> (imbalanced) olduğunu gösterir. Model kurulacaksa önemli: her şeye "No" diyen bir model bile %84 doğruluk alır. Bu yüzden accuracy yerine recall, precision ve F1 gibi metriklere bakılır.</p>' },
  { id: 'k03', dil: 'python', seviye: 1, kategori: 'Filtreleme', baslik: 'Memnuniyeti düşük Ar-Ge çalışanları',
    soru: 'Research &amp; Development departmanında iş memnuniyeti 1 olan çalışanların <code>EmployeeNumber</code>, <code>JobRole</code>, <code>Attrition</code> bilgilerini <code>sonuc</code>\'a ata.',
    ipucu: 'İki koşulu <code>&amp;</code> ile bağla, her koşulu paranteze al. Sütun seçimi için <code>loc</code>.',
    cozum: 'kosul = (hr["Department"] == "Research & Development") & (hr["JobSatisfaction"] == 1)\nsonuc = hr.loc[kosul, ["EmployeeNumber", "JobRole", "Attrition"]]',
    aciklama: '<p>pandas\'ta koşullar <code>&amp;</code> (ve) ve <code>|</code> (veya) ile bağlanır. Python\'un <code>and</code>/<code>or</code>\'u Series ile çalışmaz ve "truth value of a Series is ambiguous" hatası verir.</p><p>Parantezler zorunlu, çünkü <code>&amp;</code> operatörü <code>==</code>\'den önce işlenir.</p>' },
  { id: 'k04', dil: 'python', seviye: 1, kategori: 'Gruplama', baslik: 'Departmana göre ortalama gelir', sirali: true,
    soru: 'Departman bazında ortalama aylık geliri 2 ondalığa yuvarlayıp yüksekten düşüğe <code>sonuc</code>\'a ata.',
    ipucu: '<code>groupby("Department")["MonthlyIncome"].mean()</code> → <code>round(2)</code> → <code>sort_values</code>',
    cozum: 'sonuc = hr.groupby("Department")["MonthlyIncome"].mean().round(2).sort_values(ascending=False)',
    aciklama: '<p>Okuma sırası soldan sağa: grupla → gelir sütununu seç → ortalama al → yuvarla → sırala. Metot zinciri (method chaining) pandas\'ta çok yaygın bir yazım.</p><p>Sütunu groupby\'dan <b>sonra</b> seçmek (<code>["MonthlyIncome"]</code>) önemli. Seçmezsen tüm sayısal sütunların ortalaması alınır, metin sütunlarında da hata alırsın.</p>' },

  // ───────────── PYTHON · ORTA ─────────────
  { id: 'k05', dil: 'python', seviye: 2, kategori: 'Dönüşüm', baslik: 'Attrition\'ı sayıya çevir',
    soru: 'Attrition\'ı 1/0 olan yeni bir <code>ayrildi</code> sütununa çevir. Sonra departman bazında attrition oranını yüzde olarak (2 ondalık) hesaplayıp <code>sonuc</code>\'a ata.',
    ipucu: '<code>(hr["Attrition"] == "Yes").astype(int)</code> ya da <code>map({"Yes": 1, "No": 0})</code>.',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nsonuc = (hr.groupby("Department")["ayrildi"].mean() * 100).round(2)',
    aciklama: '<p>Hedef değişkeni 1/0\'a çevirmek hem oran hesabını (ortalama = oran) hem de modellemeyi kolaylaştırır. SQL\'deki <code>AVG(CASE WHEN ... THEN 1 ELSE 0 END)</code> ile aynı mantık.</p><p><code>map</code> yöntemi daha esnektir ama sözlükte olmayan bir değer (örn. "yes") NaN olur. <code>== "Yes"</code> karşılaştırması ise bu durumda sessizce 0 verir. Hangisinin daha güvenli olduğu veriye bağlı.</p>' },
  { id: 'k06', dil: 'python', seviye: 2, kategori: 'Dönüşüm', baslik: 'Departman × Attrition çapraz tablo',
    soru: '<code>pd.crosstab</code> ile satırlarda departman, sütunlarda Attrition (No/Yes) olan ve her satırın yüzdesini gösteren (satır toplamı 100) bir tablo oluştur, 2 ondalığa yuvarla, <code>sonuc</code>\'a ata.',
    ipucu: '<code>pd.crosstab(..., normalize="index") * 100</code>',
    cozum: 'sonuc = (pd.crosstab(hr["Department"], hr["Attrition"], normalize="index") * 100).round(2)',
    aciklama: '<p><code>crosstab</code> iki kategorik değişkenin frekans tablosudur. <code>normalize</code> parametresi:</p><ul><li><code>"index"</code>: her satır 100 (departman içi dağılım)</li><li><code>"columns"</code>: her sütun 100</li><li><code>True</code>: tüm tablo 100</li></ul><p>Miuul\'deki <code>target_summary_with_cat</code> fonksiyonunun yaptığı işe çok benzer.</p>' },
  { id: 'k07', dil: 'python', seviye: 2, kategori: 'Gruplama', baslik: 'Cinsiyet × fazla mesai',
    soru: '<code>Gender</code> ve <code>OverTime</code> kırılımında çalışan sayısını (<code>calisan</code>) ve attrition oranını (<code>oran</code>, %, 2 ondalık) içeren bir tabloyu <code>sonuc</code>\'a ata.',
    ipucu: 'Önce 1/0 sütunu oluştur, sonra iki sütunla groupby ve named aggregation: <code>agg(calisan=(...), oran=(...))</code>.',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nsonuc = hr.groupby(["Gender", "OverTime"]).agg(\n    calisan=("ayrildi", "size"),\n    oran=("ayrildi", "mean"),\n)\nsonuc["oran"] = (sonuc["oran"] * 100).round(2)',
    aciklama: '<p>groupby\'a liste verince çok seviyeli (MultiIndex) gruplama yapılır. SQL\'deki <code>GROUP BY Gender, OverTime</code> ile aynı.</p><p>Named aggregation çıktı sütunlarını doğrudan isimlendirir. <code>"size"</code> satır sayısını, <code>"mean"</code> 1/0 sütununun ortalamasını, yani oranı verir.</p>' },
  { id: 'k08', dil: 'python', seviye: 2, kategori: 'Dönüşüm', baslik: 'Yaş grupları (pd.cut)', sirali: true,
    soru: 'Yaşları <code>pd.cut</code> ile <code>18-29</code>, <code>30-39</code>, <code>40-49</code>, <code>50+</code> gruplarına ayır ve her grubun attrition oranını yüzde olarak (2 ondalık) gruplar sırasıyla <code>sonuc</code>\'a ata.',
    ipucu: '<code>bins=[17, 29, 39, 49, 100]</code>. pd.cut aralıkları sağdan kapalı kurar.',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nhr["yas_grubu"] = pd.cut(hr["Age"], bins=[17, 29, 39, 49, 100],\n                         labels=["18-29", "30-39", "40-49", "50+"])\nsonuc = (hr.groupby("yas_grubu", observed=True)["ayrildi"].mean() * 100).round(2)',
    aciklama: '<p>Aralıklar (17, 29], (29, 39]… şeklinde kurulur, yani 29 yaş ilk gruba, 30 yaş ikinci gruba düşer.</p><p><code>observed=True</code>: pd.cut sonucu Categorical tiptedir. Bu parametre olmadan groupby veride hiç olmayan kategorileri de boş grup olarak gösterebilir ve yeni pandas sürümlerinde uyarı verir.</p><p>Categorical tip, etiketlerin sırasını da korur. Bu yüzden sonuç alfabetik değil, yaş sırasıyla gelir.</p>' },
  { id: 'k09', dil: 'python', seviye: 2, kategori: 'Birleştirme', baslik: 'Eğitim etiketiyle birleştir', sirali: true,
    soru: '<code>hr</code>\'ı <code>egitim_kod</code> ile birleştirip her eğitim seviyesi (<code>egitim_adi</code>) için ortalama aylık geliri (2 ondalık) hesapla. Sonuç eğitim koduna göre (1\'den 5\'e) sıralı olsun. <code>sonuc</code>\'a ata.',
    ipucu: '<code>hr.merge(egitim_kod, on="Education")</code>, sonra kod ve etiketle grupla.',
    cozum: 'df = hr.merge(egitim_kod, on="Education", how="left")\nsonuc = (df.groupby(["Education", "egitim_adi"])["MonthlyIncome"]\n          .mean().round(2).reset_index()\n          .drop(columns="Education"))',
    aciklama: '<p><code>merge</code> SQL JOIN\'in karşılığı. Anahtar sütunun adı iki tabloda da aynı olduğu için <code>on="Education"</code> yeterli. Farklı olsaydı <code>left_on</code>/<code>right_on</code> kullanırdık.</p><p>Koda göre gruplayıp sıralama sağlandıktan sonra kod sütununu attık. Sadece etikete göre gruplasaydık alfabetik sıralanırdı.</p><p>Merge sonrası kontrol alışkanlığı: <code>len(df) == len(hr)</code> olmalı. Lookup tablosunda tekrar eden kod olsaydı satırlar çoğalırdı.</p>' },

  // ───────────── PYTHON · ZOR ─────────────
  { id: 'k10', dil: 'python', seviye: 3, kategori: 'Gruplama', baslik: 'Rol ortalamasının altında kalanlar (transform)',
    soru: 'Her çalışanın rolünün (<code>JobRole</code>) ortalama gelirini <code>transform</code> ile hesapla. Rol ortalamasının %60\'ından az kazananların <code>EmployeeNumber</code>, <code>JobRole</code>, <code>MonthlyIncome</code>, <code>rol_ortalamasi</code> (2 ondalık) bilgilerini <code>sonuc</code>\'a ata.',
    ipucu: '<code>hr.groupby("JobRole")["MonthlyIncome"].transform("mean")</code> orijinal satır sayısında bir Series döner.',
    cozum: 'hr["rol_ortalamasi"] = hr.groupby("JobRole")["MonthlyIncome"].transform("mean")\naltinda = hr[hr["MonthlyIncome"] < 0.6 * hr["rol_ortalamasi"]]\nsonuc = altinda[["EmployeeNumber", "JobRole", "MonthlyIncome", "rol_ortalamasi"]].round({"rol_ortalamasi": 2})',
    aciklama: '<p><code>agg</code> grup başına tek satır döner. <code>transform</code> ise sonucu grubun her satırına yayar ve satır sayısını korur. SQL\'deki <code>AVG(...) OVER (PARTITION BY JobRole)</code>\'un birebir karşılığı.</p><p>Karşılaştırmayı yuvarlanmamış ortalamayla yaptık, yuvarlamayı en son gösterim için uyguladık.</p>' },
  { id: 'k11', dil: 'python', seviye: 3, kategori: 'Dönüşüm', baslik: 'Rol × fazla mesai pivotu',
    soru: 'Satırlarda <code>JobRole</code>, sütunlarda <code>OverTime</code> (No/Yes), değerlerde attrition oranı (%, 2 ondalık) olan bir pivot tabloyu <code>sonuc</code>\'a ata.',
    ipucu: 'Önce 1/0 <code>ayrildi</code> sütunu, sonra <code>pd.pivot_table(..., aggfunc="mean")</code>.',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nsonuc = (pd.pivot_table(hr, index="JobRole", columns="OverTime",\n                        values="ayrildi", aggfunc="mean") * 100).round(2)',
    aciklama: '<p>Fazla mesainin etkisinin rollere göre değişip değişmediğini görmek için iki boyutlu kırılım. 9 rolün 8\'inde "Yes" sütunu daha yüksek (istisna Healthcare Representative). Bu, fazla mesai ile ayrılma arasındaki ilişkinin sadece rol farkından kaynaklanmadığını destekleyen bir bulgu.</p><p>Hücrelerdeki kişi sayılarını da görmek için <code>aggfunc=["mean", "size"]</code> verilebilir. Küçük hücrelerdeki oranlar güvenilmez olur.</p>' },
  { id: 'k12', dil: 'python', seviye: 3, kategori: 'İstatistik', baslik: 'Attrition ile en ilişkili 5 değişken', sirali: true,
    soru: 'Sayısal sütunların <code>ayrildi</code> (Attrition 1/0) ile korelasyonunu hesapla. <code>ayrildi</code>\'nın kendisini ve sabit sütunları (korelasyonu NaN olanlar) çıkar. Mutlak değere göre en güçlü 5 korelasyonu, işaretleriyle birlikte, 3 ondalığa yuvarlanmış olarak <code>sonuc</code>\'a ata.',
    ipucu: '<code>hr.select_dtypes("number").corr()["ayrildi"]</code> → <code>drop</code> → <code>dropna</code> → <code>abs().sort_values()</code> ile sırayı bul.',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nkor = hr.select_dtypes("number").corr()["ayrildi"].drop("ayrildi").dropna()\nsirali = kor.abs().sort_values(ascending=False).index\nsonuc = kor[sirali].head(5).round(3)',
    aciklama: '<p><code>corr()</code> varsayılan olarak Pearson korelasyonu hesaplar. 1/0 bir hedefle Pearson, point-biserial korelasyona eşittir.</p><p>Sabit sütunların standart sapması 0 olduğu için korelasyonu tanımsızdır (NaN), <code>dropna()</code> onları atar.</p><p>Beşi de negatif ve hepsi yaklaşık −0.16 ile −0.17 arasında: toplam deneyim, seviye, mevcut roldeki süre, gelir ve yaş arttıkça ayrılma azalıyor. Bu değişkenler birbiriyle de güçlü ilişkili (multicollinearity), yani aslında büyük ölçüde aynı "tecrübe" sinyalini taşıyorlar.</p><p>Not: OverTime metin olduğu için bu listede yok. 1/0\'a çevrilirse aslında en güçlü değişken o çıkar (yaklaşık +0.25).</p>' },
  { id: 'k13', dil: 'python', seviye: 3, kategori: 'Dönüşüm', baslik: 'Maaş çeyreklerinde attrition (qcut)', sirali: true,
    soru: 'Aylık geliri <code>pd.qcut</code> ile 4 eşit gruba böl (<code>Q1</code> en düşük … <code>Q4</code> en yüksek). Her çeyrek için en düşük gelir (<code>min_gelir</code>), en yüksek gelir (<code>max_gelir</code>) ve attrition oranını (<code>oran</code>, %, 2 ondalık) içeren tabloyu <code>sonuc</code>\'a ata. Eşit maaşlar sınırda sorun çıkarmasın diye qcut\'u <code>rank(method="first")</code> üzerine uygula.',
    ipucu: '<code>pd.qcut(hr["MonthlyIncome"].rank(method="first"), 4, labels=["Q1", "Q2", "Q3", "Q4"])</code>',
    cozum: 'hr["ayrildi"] = (hr["Attrition"] == "Yes").astype(int)\nhr["ceyrek"] = pd.qcut(hr["MonthlyIncome"].rank(method="first"), 4,\n                      labels=["Q1", "Q2", "Q3", "Q4"])\nsonuc = hr.groupby("ceyrek", observed=True).agg(\n    min_gelir=("MonthlyIncome", "min"),\n    max_gelir=("MonthlyIncome", "max"),\n    oran=("ayrildi", "mean"),\n)\nsonuc["oran"] = (sonuc["oran"] * 100).round(2)',
    aciklama: '<p><code>rank(method="first")</code> eşit değerlere görünme sırasına göre farklı sıra numaraları verir. Böylece her çeyrekte tam olarak aynı sayıda kişi olur. Veri EmployeeNumber\'a göre sıralı olduğu için bu, SQL\'deki <code>NTILE(4) OVER (ORDER BY MonthlyIncome, EmployeeNumber)</code> ile aynı sıralamayı kullanır.</p><p>Yine de sonuç h19\'dan biraz farklı çıkar. 1470 sayısı 4\'e tam bölünmez: NTILE artan 2 kişiyi ilk iki gruba verir (368, 368, 367, 367), qcut ise yüzdelik sınırlarına göre böler (368, 367, 367, 368). Bu yüzden Q2 ve Q3\'ün sınırları bir kişi kayar. Aynı analizi SQL ve pandas\'ta yapıp sayılar küçük farklarla tutmadığında ilk bakılacak yerlerden biri bu.</p><p>Doğrudan <code>qcut(hr["MonthlyIncome"], 4)</code> da çalışırdı ama sınırdaki eşit maaşlar aynı gruba düşer ve grup büyüklükleri eşit olmayabilir. RFM skorlamasında frequency için bu hile şart, çünkü orada çok fazla tekrar eden değer olur.</p>' },
  { id: 'k14', dil: 'python', seviye: 3, kategori: 'Gruplama', baslik: 'Departmanın en iyi kazanan 3 kişisi',
    soru: 'Her departmanda aylık geliri en yüksek 3 çalışanın <code>Department</code>, <code>EmployeeNumber</code>, <code>JobRole</code>, <code>MonthlyIncome</code> bilgilerini <code>sonuc</code>\'a ata. Eşitlikte küçük EmployeeNumber önce gelsin.',
    ipucu: 'Önce sırala (<code>sort_values</code>, birden fazla sütun ve yön), sonra <code>groupby("Department").head(3)</code>.',
    cozum: 'sirali = hr.sort_values(["Department", "MonthlyIncome", "EmployeeNumber"],\n                         ascending=[True, False, True])\nsonuc = sirali.groupby("Department").head(3)[["Department", "EmployeeNumber", "JobRole", "MonthlyIncome"]]',
    aciklama: '<p><code>groupby(...).head(n)</code> her gruptan mevcut sıralamadaki ilk n satırı alır. Önce doğru sıralamayı kurmak kritik.</p><p><code>ascending</code>\'e liste vererek her sütun için ayrı yön belirtilir. SQL\'deki <code>ROW_NUMBER() OVER (PARTITION BY Department ORDER BY MonthlyIncome DESC, EmployeeNumber)</code> + <code>&lt;= 3</code> ile aynı sonuç.</p><p>Alternatif: <code>hr.groupby("Department", group_keys=False).apply(lambda g: g.nlargest(3, "MonthlyIncome"))</code>. Okunaklı ama büyük veride daha yavaş.</p>' }

  { id: 'n03', dil: 'python', seviye: 1, kategori: 'NumPy', baslik: 'Yüzdelikler (percentile)', sirali: true,

    ipucu: '<code>np.percentile(dizi, [10, 25, 50, 75, 90])</code>',

    aciklama: '<p><code>np.percentile</code> ikinci argüman olarak bir liste alırsa tüm yüzdelikleri tek seferde, aynı sırayla bir dizi olarak döner. 0-1 arası değerlerle çalışan karşılığı <code>np.quantile(gelir, [0.1, 0.25, ...])</code>.</p><p>50. yüzdelik medyandır. 25. ve 75. yüzdelikler (Q1 ve Q3) IQR ile aykırı değer analizinin temelidir. Gelir dağılımı sağa çarpık olduğu için 75. ile 90. yüzdelik arasındaki fark, 10. ile 25. arasındakinden çok daha büyük.</p>' },
  { id: 'n04', dil: 'python', seviye: 2, kategori: 'NumPy', baslik: 'np.where ile etiketleme',

    ipucu: '<code>np.select([kosul1, kosul2], ["Düşük", "Orta"], default="Yüksek")</code>. Her bant için ayrılma dizisini maskeyle süzüp ortalamasını al.',
    cozum: 'gelir = hr["MonthlyIncome"].to_numpy()\nayrildi = (hr["Attrition"] == "Yes").to_numpy()\nbant = np.select([gelir < 3000, gelir < 10000], ["Düşük", "Orta"], default="Yüksek")\nsonuc = {b: round(ayrildi[bant == b].mean() * 100, 2) for b in ["Düşük", "Orta", "Yüksek"]}',

  { id: 'n06', dil: 'python', seviye: 2, kategori: 'NumPy', baslik: 'Z-skor ile standartlaştırma',

    aciklama: '<p><code>gelir - gelir.mean()</code> işleminde dizi ile tek bir sayı çıkarılıyor. NumPy sayıyı otomatik olarak dizinin her elemanına "yayar". Buna <b>broadcasting</b> denir ve döngü yazmadan tüm diziyi dönüştürmeyi sağlar.</p><p>Z-skor, değerin ortalamadan kaç standart sapma uzakta olduğunu gösterir. |z| &gt; 2 ya da 3 kuralı basit bir aykırı değer tespitidir. Ama gelir gibi çarpık dağılımlarda z-skor yanıltıcı olabilir: aykırı değerler sadece sağ tarafta çıkar. Çarpık verilerde IQR yöntemi (n10) daha sağlamdır.</p><p>scikit-learn\'deki <code>StandardScaler</code> da tam olarak bu hesabı (ddof=0 ile) yapar.</p>' },

    ipucu: '<code>q1, q3 = np.percentile(gelir, [25, 75])</code> şeklinde iki değişkene birden atayabilirsin.',

    aciklama: '<p>IQR (çeyrekler açıklığı) = Q3 − Q1, verinin ortadaki yarısının genişliği. Boxplot\'taki "bıyıkların" sınırı da 1.5 × IQR kuralıdır.</p><p>z-skordan farkı: ortalama ve standart sapma uç değerlerden etkilenir, çeyrekler ise etkilenmez. Bu yüzden çarpık dağılımlarda IQR daha güvenilirdir. Miuul\'deki <code>outlier_thresholds</code> fonksiyonu da bu hesabı yapar (orada bazen 0.05/0.95 gibi daha geniş yüzdelikler kullanılır).</p><p>Bulunan "aykırı" değerler veri hatası değil. Bunlar yüksek seviyeli yöneticilerin gerçek maaşları. Aykırı değer, otomatik silinecek bir şey değil, önce anlaşılması gereken bir şeydir.</p>' },
  { id: 'n11', dil: 'python', seviye: 3, kategori: 'NumPy', baslik: 'groupby\'sız grup ortalaması (bincount)', sirali: true,
    soru: 'pandas groupby kullanmadan, sadece NumPy ile her departmanın ortalama aylık gelirini (2 ondalık) hesapla. <code>{departman: ortalama}</code> şeklinde, departman adına göre alfabetik sıralı bir sözlük olarak <code>sonuc</code>\'a ata.',
    ipucu: '<code>np.unique(..., return_inverse=True)</code> her satıra departmanının numarasını verir. <code>np.bincount(kod, weights=gelir)</code> numara bazında toplar.',
    cozum: 'gelir = hr["MonthlyIncome"].to_numpy()\nadlar, kod = np.unique(hr["Department"].to_numpy(), return_inverse=True)\ntoplam = np.bincount(kod, weights=gelir)\nadet = np.bincount(kod)\nsonuc = dict(zip(adlar, np.round(toplam / adet, 2)))',
    aciklama: '<p>pandas groupby\'ın arka planda yaptığı işi adım adım görüyoruz:</p><ul><li><code>np.unique(..., return_inverse=True)</code>: tekrarsız departmanları (alfabetik) ve her satır için o departmanın indeksini (0, 1, 2) verir.</li><li><code>np.bincount(kod)</code>: her indeksin kaç kez geçtiğini sayar, yani grup büyüklükleri.</li><li><code>np.bincount(kod, weights=gelir)</code>: saymak yerine gelirleri toplar, yani grup toplamları.</li><li>Toplam / adet = grup ortalaması.</li></ul><p>Gerçek işte groupby kullanılır. Ama bu kalıp, mülakatlarda "pandas olmadan yap" sorularında ve NumPy\'ın nasıl düşündüğünü anlamakta çok işe yarar.</p>' },
  { id: 'n12', dil: 'python', seviye: 3, kategori: 'NumPy', baslik: 'En çok kazanan %10\'un payı',
    soru: 'En yüksek gelirli %10 çalışanın (ilk 147 kişi) toplam maaş bütçesinden aldığı payı yüzde olarak (2 ondalık) hesaplayıp <code>sonuc</code>\'a ata.',
    ipucu: '<code>np.sort</code> artan sıralar. Ters çevirmek için <code>[::-1]</code>.',
    cozum: 'gelir = hr["MonthlyIncome"].to_numpy()\nsirali = np.sort(gelir)[::-1]\nn = int(len(sirali) * 0.10)\nsonuc = round(sirali[:n].sum() / sirali.sum() * 100, 2)',
    aciklama: '<p><code>np.sort</code> yeni bir sıralı dizi döner, orijinali değiştirmez (<code>gelir.sort()</code> ise yerinde sıralar). <code>[::-1]</code> diziyi ters çevirir, böylece büyükten küçüğe sıralanır.</p><p>Çalışanların %10\'u maaş bütçesinin yaklaşık %27\'sini alıyor. Gini ve Pareto (80/20) analizlerinin temeli bu tür bir hesap. Tüm eğriyi görmek için <code>np.cumsum(sirali) / sirali.sum()</code> ile kümülatif pay dizisi çıkarılabilir.</p>' }
];

// Miuul SQL Bitirme Ödevi (NovaTech İK Analitiği) — 4. Ana Görevler, 33 soru.
// Ödevdeki tablo SQL Server'da dbo.[HR-Employee-Attrition]; burada aynı veri `hr` tablosunda.
// Açık uçlu sorulara kontrol edilebilir bir "beklenen çıktı" tanımı eklendi.
const AR = "ROUND(100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END), 2)";
const MS = (s) => `<p class="kucuk">Ödevdeki soru:</p><blockquote class="odev">${s}</blockquote>`;
const MIUUL_SORULAR = [
  // ───────── A. Genel Durum ─────────
  { id: 'm01', sira: 1, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'A. Genel Durum', baslik: '1 · Genel attrition',
    soru: MS('Toplam çalışan sayısını, ayrılan çalışan sayısını ve genel Attrition Rate değerini hesaplayın.') + '<p>Beklenen çıktı: tek satır, <code>toplam_calisan</code>, <code>ayrilan</code>, <code>attrition_rate</code> (%, 2 ondalık).</p>',
    ipucu: 'Ayrılanları <code>SUM(CASE WHEN Attrition = \'Yes\' THEN 1 ELSE 0 END)</code> ile say. Oran için 100.0 ile çarp.',
    cozum: `SELECT COUNT(*) AS toplam_calisan,\n       SUM(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS ayrilan,\n       ${AR} AS attrition_rate\nFROM hr;`,
    aciklama: '<p>Ödevin tamamında kullanacağın temel kalıp bu: <b>koşullu toplama</b>. CASE her satıra 1 ya da 0 verir. SUM bunları toplayınca ayrılan sayısını, AVG ise ayrılma oranını verir.</p><p><b>SQL Server notu:</b> İki tam sayının bölümü SQL Server\'da da tam sayıdır (237 / 1470 = 0). <code>100.0 *</code> ile çarpmak ya da <code>CAST(... AS FLOAT)</code> bu yüzden şart. Tablo adı ödevde <code>dbo.[HR-Employee-Attrition]</code>. İçinde tire olduğu için köşeli parantez gerekiyor.</p>' },
  { id: 'm02', sira: 2, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'A. Genel Durum', baslik: '2 · Cinsiyete göre', sirali: true,
    soru: MS('Attrition oranını cinsiyete göre karşılaştırın.') + '<p>Beklenen çıktı: <code>Gender</code>, <code>calisan</code>, <code>ayrilan</code>, <code>attrition_rate</code>. Cinsiyete göre (alfabetik) sırala.</p>',
    ipucu: 'Bir önceki sorgunun aynısını <code>GROUP BY Gender</code> ile yaz.',
    cozum: `SELECT Gender,\n       COUNT(*) AS calisan,\n       SUM(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS ayrilan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY Gender\nORDER BY Gender;`,
    aciklama: '<p>Genel oran sorgusuna sadece <code>GROUP BY</code> eklendi. A bölümündeki tüm sorular bu kalıbın farklı kırılımları.</p><p>Oranın yanında kişi sayısını da göstermek iyi bir alışkanlık: yöneticiler "yüzde kaç?" kadar "kaç kişi?" diye de sorar.</p>' },
  { id: 'm03', sira: 3, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'A. Genel Durum', baslik: '3 · Medeni duruma göre', sirali: true,
    soru: MS('Attrition oranını medeni duruma göre karşılaştırın.') + '<p>Beklenen çıktı: <code>MaritalStatus</code>, <code>calisan</code>, <code>attrition_rate</code>. Oranı en yüksek grup en üstte.</p>',
    ipucu: '<code>GROUP BY MaritalStatus</code>, <code>ORDER BY attrition_rate DESC</code>.',
    cozum: `SELECT MaritalStatus,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY MaritalStatus\nORDER BY attrition_rate DESC;`,
    aciklama: '<p>ORDER BY\'da SELECT\'teki alias (<code>attrition_rate</code>) kullanılabilir, çünkü ORDER BY SELECT\'ten sonra çalışır. SQL Server\'da da geçerli.</p><p>Bekarlarda oran belirgin şekilde yüksek. Yaşla da ilişkili olabilir (bekarlar ortalamada 2 yaş kadar daha genç). Yönetici özetinde bunu "tek başına neden" gibi sunmamak gerekir.</p>' },
  { id: 'm04', sira: 4, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'A. Genel Durum', baslik: '4 · Yaş gruplarına göre', sirali: true,
    soru: MS('Yaş gruplarına göre çalışan sayısı ve Attrition Rate hesaplayın.') + '<p>Gruplar: <code>18-24</code>, <code>25-34</code>, <code>35-44</code>, <code>45-54</code>, <code>55+</code>. Beklenen çıktı: <code>yas_grubu</code>, <code>calisan</code>, <code>attrition_rate</code>, gruba göre sıralı.</p>',
    ipucu: 'CASE WHEN ile grubu oluştur. Grup adları alfabetik olarak da doğru sıralanıyor.',
    cozum: `SELECT CASE\n         WHEN Age < 25 THEN '18-24'\n         WHEN Age < 35 THEN '25-34'\n         WHEN Age < 45 THEN '35-44'\n         WHEN Age < 55 THEN '45-54'\n         ELSE '55+'\n       END AS yas_grubu,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY yas_grubu\nORDER BY yas_grubu;`,
    aciklama: '<p>CASE koşulları sırayla kontrol eder ve ilk doğru olanda durur. Bu yüzden alt sınırları tekrar yazmaya gerek yok.</p><p><b>SQL Server notu:</b> SQL Server, GROUP BY\'da SELECT alias\'ını <b>kabul etmez</b>. Orada ya CASE ifadesini GROUP BY\'da aynen tekrar yazarsın ya da grubu bir CTE/alt sorguda oluşturup dışarıda gruplarsın:</p><pre class="kod-blok"><code>WITH t AS (SELECT CASE ... END AS yas_grubu, Attrition FROM dbo.[HR-Employee-Attrition])\nSELECT yas_grubu, COUNT(*) ... FROM t GROUP BY yas_grubu;</code></pre><p>Ödevdeki "aynı sorguyu gereksiz yere tekrar etmeyin" kuralı için CTE yolu daha uygun.</p>' },
  { id: 'm05', sira: 5, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'A. Genel Durum', baslik: '5 · Gelir gruplarına göre', sirali: true,
    soru: MS('Gelir gruplarına göre Attrition Rate hesaplayın.') + '<p>Gruplar (MonthlyIncome): 3000\'den az <code>Düşük</code>, 3000-5999 <code>Orta</code>, 6000-9999 <code>Orta-Yüksek</code>, 10000 ve üzeri <code>Yüksek</code>. Beklenen çıktı: <code>gelir_grubu</code>, <code>calisan</code>, <code>attrition_rate</code>. Düşükten yükseğe sırala.</p>',
    ipucu: 'Grup adları alfabetik olarak doğru sıralanmıyor. <code>ORDER BY MIN(MonthlyIncome)</code> ile gelir sırasına göre dizebilirsin.',
    cozum: `SELECT CASE\n         WHEN MonthlyIncome < 3000 THEN 'Düşük'\n         WHEN MonthlyIncome < 6000 THEN 'Orta'\n         WHEN MonthlyIncome < 10000 THEN 'Orta-Yüksek'\n         ELSE 'Yüksek'\n       END AS gelir_grubu,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY gelir_grubu\nORDER BY MIN(MonthlyIncome);`,
    aciklama: '<p>Metin etiketler alfabetik sıralanır (Düşük, Orta, Orta-Yüksek, Yüksek burada şans eseri doğru gibi dursa da "Yüksek" ile "Düşük" yer değiştirebilirdi). <code>ORDER BY MIN(MonthlyIncome)</code> her grubu içindeki en düşük gelire göre sıralar ve doğal sırayı garanti eder. Alternatif: CASE içinde bir de sıra numarası üretmek.</p><p>Gelir arttıkça ayrılma belirgin şekilde düşüyor. Yönetici özetindeki en güçlü bulgulardan biri olur.</p>' },
  { id: 'm06', sira: 6, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'A. Genel Durum', baslik: '6 · Departmana göre', sirali: true,
    soru: MS('Departmanlara göre Attrition Rate hesaplayın.') + '<p>Beklenen çıktı: <code>Department</code>, <code>calisan</code>, <code>ayrilan</code>, <code>attrition_rate</code>. Oranı en yüksek departman en üstte.</p>',
    ipucu: 'A bölümündeki kalıbın aynısı, <code>GROUP BY Department</code>.',
    cozum: `SELECT Department,\n       COUNT(*) AS calisan,\n       SUM(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS ayrilan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY Department\nORDER BY attrition_rate DESC;`,
    aciklama: '<p>Sales oranda en yüksek, ama ayrılan <b>kişi sayısı</b> olarak R&amp;D önde, çünkü en kalabalık departman. Yönetici özetinde ikisini birlikte vermek önemli: oran riski, sayı ise etkinin büyüklüğünü gösterir.</p>' },
  { id: 'm07', sira: 7, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'A. Genel Durum', baslik: '7 · JobRole\'e göre', sirali: true,
    soru: MS('JobRole bazında Attrition Rate hesaplayın.') + '<p>Beklenen çıktı: <code>JobRole</code>, <code>calisan</code>, <code>attrition_rate</code>. Oranı en yüksek rol en üstte.</p>',
    ipucu: '<code>GROUP BY JobRole</code>, <code>ORDER BY attrition_rate DESC</code>.',

  // ───────── B. Çalışan Profili ─────────
  { id: 'm08', sira: 8, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'B. Çalışan Profili', baslik: '8 · Ayrılan vs kalan profili', sirali: true,
    soru: MS('Çalışanların yaş, eğitim, medeni durum ve toplam şirket deneyimini inceleyin.') + '<p>Ayrılanları ve kalanları karşılaştır. Beklenen çıktı: <code>Attrition</code>, <code>calisan</code>, <code>ort_yas</code>, <code>ort_egitim</code> (Education 1-5), <code>ort_toplam_deneyim</code> (TotalWorkingYears), <code>bekar_orani</code> (% Single). Ortalamalar ve oran 2 ondalık. Attrition\'a göre sırala (No, Yes).</p>',
    ipucu: 'Gruplama Attrition\'a göre. Bekar oranı için <code>AVG(CASE WHEN MaritalStatus = \'Single\' THEN 1.0 ELSE 0 END)</code>.',
    cozum: `SELECT Attrition,\n       COUNT(*) AS calisan,\n       ROUND(AVG(Age), 2) AS ort_yas,\n       ROUND(AVG(Education), 2) AS ort_egitim,\n       ROUND(AVG(TotalWorkingYears), 2) AS ort_toplam_deneyim,\n       ROUND(100.0 * AVG(CASE WHEN MaritalStatus = 'Single' THEN 1 ELSE 0 END), 2) AS bekar_orani\nFROM hr\nGROUP BY Attrition\nORDER BY Attrition;`,
    aciklama: '<p>"Profil inceleme" sorusunu ölçülebilir hale getirmenin bir yolu: ayrılanlar ile kalanları yan yana koymak. Ayrılanlar daha genç, daha az deneyimli ve daha çok bekar. Eğitim ortalamasında ise fark neredeyse yok.</p><p><b>SQL Server notu:</b> <code>AVG(Age)</code> tam sayı sütunda SQL Server\'da <b>tam sayı</b> döner (36.9 değil 36). Ondalıklı ortalama için <code>AVG(CAST(Age AS FLOAT))</code> ya da <code>AVG(Age * 1.0)</code> yaz. SQLite\'ta bu sorun yok.</p>' },
  { id: 'm09', sira: 9, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'B. Çalışan Profili', baslik: '9 · EducationField × Education', sirali: true,
    soru: MS('EducationField ve Education seviyesini birlikte inceleyin.') + '<p>Eğitim seviyesinin adını <code>egitim_kod</code> tablosundan al. Beklenen çıktı: <code>EducationField</code>, <code>egitim_adi</code>, <code>calisan</code>, <code>attrition_rate</code>. EducationField\'a, sonra Education koduna göre sırala.</p>',
    ipucu: '<code>JOIN egitim_kod e ON h.Education = e.Education</code>, iki sütunla GROUP BY.',
    cozum: `SELECT h.EducationField,\n       e.egitim_adi,\n       COUNT(*) AS calisan,\n       ROUND(100.0 * AVG(CASE WHEN h.Attrition = 'Yes' THEN 1 ELSE 0 END), 2) AS attrition_rate\nFROM hr h\nJOIN egitim_kod e ON h.Education = e.Education\nGROUP BY h.EducationField, h.Education, e.egitim_adi\nORDER BY h.EducationField, h.Education;`,
    aciklama: '<p>İki kategorik değişkenin birlikte incelenmesi = çoklu GROUP BY. Kod tablosuyla JOIN, 1-5 kodlarını okunur hale getirir. Sıralamayı etikete göre değil koda göre yaptık ki "Below College → Doctor" sırası korunsun.</p><p>Bazı hücreler çok küçük (birkaç kişi). %0 ya da %50 gibi uç oranlar orada anlamsız olabilir. Yönetici özetine taşırken küçük grupları ayıkla. Ödevde bu tabloda yoktu ama bir sonraki adım <code>HAVING COUNT(*) &gt;= 20</code> gibi bir eşik olurdu.</p><p>Ödevdeki gerçek tabloda kod tablosu yok. Orada etiketi bir CASE ile (<code>WHEN 1 THEN \'Below College\'</code> …) üretebilirsin.</p>' },
  { id: 'm10', sira: 10, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'B. Çalışan Profili', baslik: '10 · Medeni durum × cinsiyet', sirali: true,
    soru: MS('Medeni durum ile cinsiyeti birlikte analiz edin.') + '<p>Beklenen çıktı: <code>MaritalStatus</code>, <code>Gender</code>, <code>calisan</code>, <code>attrition_rate</code>. MaritalStatus\'a, sonra Gender\'a göre sırala.</p>',
    ipucu: '<code>GROUP BY MaritalStatus, Gender</code>',
    cozum: `SELECT MaritalStatus,\n       Gender,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY MaritalStatus, Gender\nORDER BY MaritalStatus, Gender;`,
    aciklama: '<p>İki boyutlu kırılım, tek boyutlu tabloların saklayabildiği farkları gösterir. Burada medeni durumun etkisi her iki cinsiyette de benzer yönde: bekarlarda oran her iki cinsiyette de en yüksek.</p><p>Aynı tabloyu "pivot" (sütunlarda Male/Female) olarak da kurabilirsin: <code>AVG(CASE WHEN Gender = \'Male\' THEN ... END)</code>. Bu kalıp F bölümünde 31. soruda gerekecek.</p>' },
  { id: 'm11', sira: 11, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'B. Çalışan Profili', baslik: '11 · Çalışılan şirket sayısı', sirali: true,
    soru: MS('NumCompaniesWorked değerine göre çalışanların dağılımını ve Attrition oranını inceleyin.') + '<p>Beklenen çıktı: <code>NumCompaniesWorked</code>, <code>calisan</code>, <code>yuzde</code> (tüm çalışanlar içindeki payı, 2 ondalık), <code>attrition_rate</code>. NumCompaniesWorked\'e göre sırala.</p>',
    ipucu: 'Payı hesaplamak için grubun kişi sayısını toplam çalışan sayısına böl: <code>COUNT(*) * 100.0 / (SELECT COUNT(*) FROM hr)</code> ya da <code>SUM(COUNT(*)) OVER ()</code>.',
    cozum: `SELECT NumCompaniesWorked,\n       COUNT(*) AS calisan,\n       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS yuzde,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY NumCompaniesWorked\nORDER BY NumCompaniesWorked;`,
    aciklama: '<p>"Dağılım" = her grubun toplam içindeki payı. <code>SUM(COUNT(*)) OVER ()</code> ilginç bir kalıp: önce GROUP BY ile her grubun sayısı hesaplanır, sonra window function bu sayıların toplamını (yani tüm çalışanları) her satıra ekler. Skaler alt sorgu (<code>SELECT COUNT(*) FROM hr</code>) da aynı sonucu verir.</p><p>5 ve üzeri şirkette çalışmış olanlarda oran genelde %22-25 civarında (8 hariç). Daha önce tek bir şirkette çalışmış olanlar (1) ise hem en kalabalık grup hem de oranı %18.8 ile ortalamanın üstünde. 2-4 arası en düşük. İlişki düz bir çizgi değil, yorumlarken bunu belirtmek gerekir.</p>' },

  // ───────── C. Memnuniyet ve Performans ─────────
  { id: 'm12', sira: 12, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'C. Memnuniyet ve Performans', baslik: '12 · JobSatisfaction', sirali: true,
    soru: MS('JobSatisfaction seviyelerine göre Attrition Rate hesaplayın.') + '<p>Beklenen çıktı: <code>JobSatisfaction</code> (1-4), <code>calisan</code>, <code>attrition_rate</code>. Seviyeye göre sırala.</p>',

  { id: 'm13', sira: 13, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'C. Memnuniyet ve Performans', baslik: '13 · JobInvolvement', sirali: true,
