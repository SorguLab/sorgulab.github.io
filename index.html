    cozum: `SELECT JobInvolvement,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY JobInvolvement\nORDER BY JobInvolvement;`,
    aciklama: '<p>İşe bağlılığı en düşük (1) grupta oran çok yüksek. Ama bu grup küçük (yaklaşık 80 kişi). Hem oran hem kişi sayısı birlikte yorumlanmalı.</p><p>Ödevdeki "aynı sorguyu gereksiz yere tekrar etmeyin" kuralı: 12, 13, 16 ve 19. sorular aynı kalıbın farklı sütunları. Ödev dosyasında bunları tek bir <code>UNION ALL</code> sorgusunda birleştirip "değişken, seviye, oran" formatında sunmak şık bir çözüm olur.</p>' },
  { id: 'm14', sira: 14, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'C. Memnuniyet ve Performans', baslik: '14 · Ortam ve ilişki memnuniyeti', sirali: true,
    soru: MS('EnvironmentSatisfaction ve RelationshipSatisfaction alanlarını analiz edin.') + '<p>İki alanı yan yana karşılaştır. Beklenen çıktı: <code>puan</code> (1-4), <code>etiket</code> (memnuniyet_kod\'dan), <code>ortam_attrition_rate</code>, <code>iliski_attrition_rate</code>. Puana göre sırala.</p>',
    ipucu: 'İki alanın oranını ayrı CTE\'lerde hesapla, sonra ikisini <code>memnuniyet_kod</code> üzerinden puana göre birleştir.',
    cozum: `WITH ortam AS (\n  SELECT EnvironmentSatisfaction AS puan, ${AR} AS oran\n  FROM hr GROUP BY EnvironmentSatisfaction\n), iliski AS (\n  SELECT RelationshipSatisfaction AS puan, ${AR} AS oran\n  FROM hr GROUP BY RelationshipSatisfaction\n)\nSELECT m.puan, m.etiket,\n       o.oran AS ortam_attrition_rate,\n       i.oran AS iliski_attrition_rate\nFROM memnuniyet_kod m\nJOIN ortam o ON o.puan = m.puan\nJOIN iliski i ON i.puan = m.puan\nORDER BY m.puan;`,
    aciklama: '<p>İki farklı sütunun aynı ölçekteki (1-4) etkisini karşılaştırmak için önce her birini ayrı ayrı grupla, sonra ortak anahtar (puan) üzerinden yan yana getir. Kod tablosu burada hem etiket veriyor hem de iki CTE\'yi bağlayan omurga oluyor.</p><p>Ortam memnuniyeti 1 olanlarda oran belirgin yüksek. İlişki memnuniyetinin etkisi ise daha zayıf. Yönetici özetinde "fiziksel/çalışma ortamı" iyileştirmesine yönelik bir öneri buradan çıkabilir.</p>' },
  { id: 'm15', sira: 15, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'C. Memnuniyet ve Performans', baslik: '15 · Performans ve zam', sirali: true,
    soru: MS('PerformanceRating ile PercentSalaryHike arasındaki durumu inceleyin.') + '<p>Beklenen çıktı: <code>PerformanceRating</code>, <code>calisan</code>, <code>min_zam</code>, <code>ort_zam</code> (2 ondalık), <code>max_zam</code>, <code>attrition_rate</code>. PerformanceRating\'e göre sırala.</p>',
    ipucu: 'Zam sütunu için MIN, AVG ve MAX\'ı aynı GROUP BY\'da hesapla.',
    cozum: `SELECT PerformanceRating,\n       COUNT(*) AS calisan,\n       MIN(PercentSalaryHike) AS min_zam,\n       ROUND(AVG(PercentSalaryHike), 2) AS ort_zam,\n       MAX(PercentSalaryHike) AS max_zam,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY PerformanceRating\nORDER BY PerformanceRating;`,
    aciklama: '<p>İlginç bir bulgu: veride sadece 3 ve 4 puanları var ve iki grubun zam aralıkları hiç çakışmıyor (3: %11-19, 4: %20-25). Yani performans puanı neredeyse doğrudan zam oranından türetilmiş. Bu, iki değişkeni aynı modele koymanın anlamsız olacağını gösteren bir veri kalitesi tespiti.</p><p>Ayrılma oranları iki grupta neredeyse aynı: yüksek performans ve yüksek zam, ayrılmayı belirgin şekilde azaltmamış.</p>' },
  { id: 'm16', sira: 16, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'C. Memnuniyet ve Performans', baslik: '16 · Hisse opsiyonu', sirali: true,
    soru: MS('StockOptionLevel değerine göre Attrition oranlarını karşılaştırın.') + '<p>Beklenen çıktı: <code>StockOptionLevel</code> (0-3), <code>calisan</code>, <code>attrition_rate</code>. Seviyeye göre sırala.</p>',
    ipucu: 'C bölümündeki kalıp, <code>GROUP BY StockOptionLevel</code>.',
    cozum: `SELECT StockOptionLevel,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY StockOptionLevel\nORDER BY StockOptionLevel;`,
    aciklama: '<p>Hisse opsiyonu olmayan (0) çalışanlarda oran yüksek, 1 ve 2\'de düşüyor, 3\'te yeniden artıyor. Doğrusal olmayan bir ilişki. Ayrıca veride hiçbir bekar çalışanın hisse opsiyonu yok: 470 bekarın hepsi 0 seviyesinde ve 0 seviyesinin dörtte üçü bekar. Yani bu tablo büyük ölçüde 3. sorudaki medeni durum etkisini tekrar ediyor olabilir. Yine "tek başına neden" yorumundan kaçınmak gerekir.</p>' },

  // ───────── D. Çalışma Koşulları ─────────
  { id: 'm17', sira: 17, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'D. Çalışma Koşulları', baslik: '17 · Çalışma koşulları profili', sirali: true,
    soru: MS('WorkLifeBalance, TrainingTimesLastYear, DistanceFromHome ve OverTime alanlarını analiz edin.') + '<p>Ayrılanları ve kalanları karşılaştır. Beklenen çıktı: <code>Attrition</code>, <code>ort_is_yasam_dengesi</code>, <code>ort_egitim_sayisi</code>, <code>ort_mesafe</code>, <code>fazla_mesai_orani</code> (% OverTime = Yes). Hepsi 2 ondalık. Attrition\'a göre sırala.</p>',
    ipucu: '8. sorudaki profil karşılaştırmasının aynısı, farklı sütunlarla.',
    cozum: `SELECT Attrition,\n       ROUND(AVG(WorkLifeBalance), 2) AS ort_is_yasam_dengesi,\n       ROUND(AVG(TrainingTimesLastYear), 2) AS ort_egitim_sayisi,\n       ROUND(AVG(DistanceFromHome), 2) AS ort_mesafe,\n       ROUND(100.0 * AVG(CASE WHEN OverTime = 'Yes' THEN 1 ELSE 0 END), 2) AS fazla_mesai_orani\nFROM hr\nGROUP BY Attrition\nORDER BY Attrition;`,
    aciklama: '<p>Dört farklı değişkeni tek sorguda karşılaştırmanın yolu. En büyük fark fazla mesaide: ayrılanların yaklaşık yarısı fazla mesai yapıyor, kalanlarda bu oran dörtte bir civarında. Ortalama mesafe de ayrılanlarda biraz daha yüksek.</p><p>SQL Server\'da tam sayı sütunların AVG\'si tam sayı döner. Burada <code>AVG(WorkLifeBalance * 1.0)</code> yazmazsan 2.66 yerine 2 görürsün ve fark kaybolur.</p>' },
  { id: 'm18', sira: 18, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'D. Çalışma Koşulları', baslik: '18 · Fazla mesai × seyahat', sirali: true,
    soru: MS('OverTime ile BusinessTravel durumlarını birlikte inceleyin.') + '<p>Beklenen çıktı: <code>OverTime</code>, <code>BusinessTravel</code>, <code>calisan</code>, <code>attrition_rate</code>. Oranı en yüksek kombinasyon en üstte.</p>',
    ipucu: 'İki sütunla GROUP BY, oran sırasıyla ORDER BY.',
    cozum: `SELECT OverTime,\n       BusinessTravel,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY OverTime, BusinessTravel\nORDER BY attrition_rate DESC;`,
    aciklama: '<p>Hem fazla mesai yapan hem sık seyahat eden çalışanlar en riskli grup. Seyahat etmeyen ve fazla mesai yapmayanlarda ise oran çok düşük. İki stres kaynağı üst üste binince risk katlanıyor.</p><p>Bu tip "etkileşim" bulguları yönetici özetinde tek başına oranlardan daha değerlidir: "fazla mesai kötü" yerine "fazla mesai + sık seyahat kombinasyonu kritik" demek daha somut bir aksiyona dönüşür.</p>' },
  { id: 'm19', sira: 19, kaynak: 'miuul', dil: 'sql', seviye: 1, kategori: 'D. Çalışma Koşulları', baslik: '19 · İş-yaşam dengesi', sirali: true,
    soru: MS('WorkLifeBalance seviyelerine göre Attrition Rate hesaplayın.') + '<p>Beklenen çıktı: <code>WorkLifeBalance</code> (1-4), <code>calisan</code>, <code>attrition_rate</code>. Seviyeye göre sırala.</p>',
    ipucu: 'C bölümündeki kalıp.',
    cozum: `SELECT WorkLifeBalance,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY WorkLifeBalance\nORDER BY WorkLifeBalance;`,
    aciklama: '<p>İş-yaşam dengesi en kötü (1) olan grupta oran yaklaşık üçte bir. Bu grup küçük (80 kişi) ama 26. soruda bu grubun içine daha derin bakacaksın.</p><p>Veri sözlüğüne göre: 1 = Bad, 2 = Good, 3 = Better, 4 = Best.</p>' },
  { id: 'm20', sira: 20, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'D. Çalışma Koşulları', baslik: '20 · Mesafe grupları', sirali: true,
    soru: MS('DistanceFromHome için anlamlı mesafe grupları oluşturup Attrition oranlarını karşılaştırın.') + '<p>Gruplar: 1-5 <code>Yakın</code>, 6-10 <code>Orta</code>, 11-20 <code>Uzak</code>, 21 ve üzeri <code>Çok uzak</code>. Beklenen çıktı: <code>mesafe_grubu</code>, <code>calisan</code>, <code>attrition_rate</code>. Yakından uzağa sırala.</p>',
    ipucu: 'CASE ile grupla, <code>ORDER BY MIN(DistanceFromHome)</code> ile doğal sıraya diz.',
    cozum: `SELECT CASE\n         WHEN DistanceFromHome <= 5 THEN 'Yakın'\n         WHEN DistanceFromHome <= 10 THEN 'Orta'\n         WHEN DistanceFromHome <= 20 THEN 'Uzak'\n         ELSE 'Çok uzak'\n       END AS mesafe_grubu,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY mesafe_grubu\nORDER BY MIN(DistanceFromHome);`,
    aciklama: '<p>"Anlamlı grup" seçimi bir analist kararıdır. Burada iki yaklaşım var: iş mantığıyla sabit sınırlar (yakın/orta/uzak) ya da veriye göre eşit büyüklükte gruplar (NTILE). İş mantığı yöneticiye daha kolay anlatılır. Kullandığın sınırları ödevde mutlaka yaz.</p><p>Yakın ve orta grupları neredeyse aynı (%14 civarı). Artış 10 km\'den sonra başlıyor: uzak ve çok uzak gruplarda oran %20-22. Yani etki eşikli, düzgün bir artış değil.</p>' },
  { id: 'm21', sira: 21, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'D. Çalışma Koşulları', baslik: '21 · Denge × eğitim', sirali: true,
    soru: MS('WorkLifeBalance ile eğitim/training göstergelerini birlikte değerlendirin.') + '<p>TrainingTimesLastYear gruplanacak: 0-1 <code>Az</code>, 2-3 <code>Orta</code>, 4 ve üzeri <code>Çok</code>. Beklenen çıktı: <code>WorkLifeBalance</code>, <code>egitim_grubu</code>, <code>calisan</code>, <code>attrition_rate</code>. WorkLifeBalance\'a, sonra eğitim sayısına (azdan çoğa) göre sırala.</p>',
    ipucu: 'İki boyutlu GROUP BY. İkinci boyutun sırası için <code>ORDER BY WorkLifeBalance, MIN(TrainingTimesLastYear)</code>.',
    cozum: `SELECT WorkLifeBalance,\n       CASE\n         WHEN TrainingTimesLastYear <= 1 THEN 'Az'\n         WHEN TrainingTimesLastYear <= 3 THEN 'Orta'\n         ELSE 'Çok'\n       END AS egitim_grubu,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY WorkLifeBalance, egitim_grubu\nORDER BY WorkLifeBalance, MIN(TrainingTimesLastYear);`,
    aciklama: '<p>İş-yaşam dengesi 1 olanlarda eğitim grubundan bağımsız olarak oran %30 civarında. Eğitimin tutarlı bir etkisi görünmüyor: WLB 2\'de çok eğitim alanlarda oran düşük (%10), ama WLB 4\'te bu ilişki tersine dönüyor. Ayrıca bazı hücreler çok küçük (7 ve 10 kişi).</p><p>"Tutarlı bir ilişki bulunamadı" da geçerli ve değerli bir bulgudur. Yönetici özetinde bunu söylemek, eğitime yatırımın tek başına ayrılmayı azaltacağı varsayımını sınar.</p><p>İki boyutlu tablolarda her hücrede kaç kişi olduğunu göstermek bu yüzden şart. Aksi halde "WLB=1 ve az eğitimde %X" gibi bir cümle, aslında 5 kişiye dayanabilir.</p>' },

  // ───────── E. Kritik Risk Grupları ─────────
  { id: 'm22', sira: 22, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'E. Kritik Risk Grupları', baslik: '22 · İlk yıl', sirali: true,
    soru: MS('İlk çalışma yılında bulunan çalışanlarda Attrition oranını hesaplayın.') + '<p>İlk yıl = <code>YearsAtCompany</code> 0 ya da 1. Bu grubu geri kalanla karşılaştır. Beklenen çıktı: <code>grup</code> (<code>İlk yıl</code> / <code>Diğer</code>), <code>calisan</code>, <code>attrition_rate</code>. Önce İlk yıl.</p>',
    ipucu: '<code>CASE WHEN YearsAtCompany &lt;= 1 THEN \'İlk yıl\' ELSE \'Diğer\' END</code> ile grupla.',
    cozum: `SELECT CASE WHEN YearsAtCompany <= 1 THEN 'İlk yıl' ELSE 'Diğer' END AS grup,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY grup\nORDER BY MIN(YearsAtCompany);`,
    aciklama: '<p>"İlk yıl" tanımı bir karar: <code>YearsAtCompany = 0</code> (henüz 1 yılı dolmamış) sadece 44 kişi ve oranı %36. 1. yıldakiler 171 kişi ve oranı %34. İkisi çok benzer olduğu için birlikte aldık. Ödevde hangisini seçtiğini açıkça yaz.</p><p>İlk yıldaki çalışanlarda oran, diğerlerinin yaklaşık iki katından fazla. Onboarding ve ilk yılda mentorluk, yönetici özetinde öneri olarak çok güçlü durur.</p>' },
  { id: 'm23', sira: 23, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'E. Kritik Risk Grupları', baslik: '23 · Kıdem bantları', sirali: true,
    soru: MS('Çalışanları kıdemlerine göre sıralayıp anlam çıkarın.') + '<p>Kıdem (YearsAtCompany) bantları: <code>0-2</code>, <code>3-5</code>, <code>6-10</code>, <code>11+</code>. Beklenen çıktı: <code>kidem_bandi</code>, <code>calisan</code>, <code>ort_gelir</code> (2 ondalık), <code>attrition_rate</code>. Kıdeme göre (azdan çoğa) sırala.</p>',
    ipucu: 'CASE ile bantla, <code>ORDER BY MIN(YearsAtCompany)</code>.',
    cozum: `SELECT CASE\n         WHEN YearsAtCompany <= 2 THEN '0-2'\n         WHEN YearsAtCompany <= 5 THEN '3-5'\n         WHEN YearsAtCompany <= 10 THEN '6-10'\n         ELSE '11+'\n       END AS kidem_bandi,\n       COUNT(*) AS calisan,\n       ROUND(AVG(MonthlyIncome), 2) AS ort_gelir,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY kidem_bandi\nORDER BY MIN(YearsAtCompany);`,
    aciklama: '<p>"Sıralayıp anlam çıkarma" sorusunu bantlarla somutlaştırdık. Kıdem arttıkça hem gelir artıyor hem ayrılma düşüyor. İlk 2 yıl en kritik dönem.</p><p><code>11+</code> etiketi alfabetik sıralamada <code>0-2</code>\'den sonra, <code>3-5</code>\'ten önce gelirdi. <code>ORDER BY MIN(YearsAtCompany)</code> bu tuzağı önlüyor.</p><p>Gelir ve kıdem birbirine bağlı. "Düşük gelir mi ayrılmaya yol açıyor, yoksa yeni olmak mı?" sorusu bu tabloyla ayrıştırılamaz. Yönetici özetinde bunu açıkça belirtmek analitik olgunluk gösterir.</p>' },
  { id: 'm24', sira: 24, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'E. Kritik Risk Grupları', baslik: '24 · Yüksek performans + fazla mesai', sirali: true,
    soru: MS('Yüksek performans gösterip aynı zamanda OverTime yapan çalışanları inceleyin.') + '<p>Yüksek performans = <code>PerformanceRating = 4</code>. Performans × fazla mesai kırılımını göster. Beklenen çıktı: <code>PerformanceRating</code>, <code>OverTime</code>, <code>calisan</code>, <code>ort_gelir</code> (2 ondalık), <code>attrition_rate</code>. PerformanceRating\'e, sonra OverTime\'a göre sırala.</p>',
    ipucu: 'Sadece hedef grubu filtrelemek yerine dört kombinasyonu birlikte göstermek karşılaştırma imkânı verir.',
    cozum: `SELECT PerformanceRating,\n       OverTime,\n       COUNT(*) AS calisan,\n       ROUND(AVG(MonthlyIncome), 2) AS ort_gelir,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY PerformanceRating, OverTime\nORDER BY PerformanceRating, OverTime;`,
    aciklama: '<p>"X grubunu inceleyin" sorularında sadece o grubu <code>WHERE</code> ile süzmek yetersiz kalır, çünkü neyle kıyaslayacağını bilemezsin. Dört kombinasyonu yan yana koyunca hedef grubun (4 + Yes) diğerlerinden ne kadar farklı olduğu görünür.</p><p>Yüksek performanslı ve fazla mesai yapan çalışanların ayrılma oranı (%35), fazla mesai yapmayan yüksek performanslıların (%9) yaklaşık dört katı. Üstelik bu grubun ortalama geliri diğer üç gruptan düşük. Şirketin "en değerli ve en yorgun" çalışanlarını kaybetme riski yönetici özetine girecek bir bulgu.</p>' },
  { id: 'm25', sira: 25, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'E. Kritik Risk Grupları', baslik: '25 · Üçlü risk kombinasyonu', sirali: true,
    soru: MS('Düşük JobInvolvement + uzun süre terfi bekleme + OverTime kombinasyonunu analiz edin.') + '<p>Tanım: <code>JobInvolvement &lt;= 2</code> ve <code>YearsSinceLastPromotion &gt;= 5</code> ve <code>OverTime = \'Yes\'</code>. Bu kombinasyondakileri diğer herkesle karşılaştır. Beklenen çıktı: <code>grup</code> (<code>Riskli kombinasyon</code> / <code>Diğer</code>), <code>calisan</code>, <code>attrition_rate</code>. Riskli kombinasyon önce.</p>',
    ipucu: 'Üç koşulu tek bir CASE içinde AND ile birleştir.',
    cozum: `SELECT CASE\n         WHEN JobInvolvement <= 2 AND YearsSinceLastPromotion >= 5 AND OverTime = 'Yes'\n         THEN 'Riskli kombinasyon' ELSE 'Diğer'\n       END AS grup,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY grup\nORDER BY grup DESC;`,
    aciklama: '<p>Kombinasyon sadece 19 kişi ve oranı yaklaşık %26: genelin üzerinde ama sanıldığı kadar dramatik değil. Bunun bir nedeni, uzun süre terfi beklemenin kıdemli çalışanlarda görülmesi, kıdemli çalışanların da daha az ayrılması.</p><p>Analist dersi: sezgisel olarak "çok riskli" görünen kombinasyonlar veride her zaman öyle çıkmaz. Ve 19 kişilik bir grupta 1-2 kişinin değişmesi oranı birkaç puan oynatır. Yönetici özetinde grup büyüklüğünü mutlaka belirt.</p><p>"Düşük" ve "uzun" için eşik seçimi yine bir karar (≤2, ≥5). Farklı eşiklerle (örneğin terfi ≥ 3) sonucun nasıl değiştiğine bakmak sağlamlık (robustness) kontrolüdür.</p>' },
  { id: 'm26', sira: 26, kaynak: 'miuul', dil: 'sql', seviye: 2, kategori: 'E. Kritik Risk Grupları', baslik: '26 · WLB = 1 içinde riskli gruplar', sirali: true,
    soru: MS('WorkLifeBalance = 1 olan çalışanlarda departman ve JobRole bazında riskli grupları bulun.') + '<p>Küçük grupları ele: en az 5 çalışanı olan kombinasyonlar. Beklenen çıktı: <code>Department</code>, <code>JobRole</code>, <code>calisan</code>, <code>attrition_rate</code>. Oranı en yüksek en üstte.</p>',
    ipucu: 'WHERE ile WLB = 1\'e süz, iki sütunla grupla, <code>HAVING COUNT(*) &gt;= 5</code>.',
    cozum: `SELECT Department,\n       JobRole,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nWHERE WorkLifeBalance = 1\nGROUP BY Department, JobRole\nHAVING COUNT(*) >= 5\nORDER BY attrition_rate DESC;`,
    aciklama: '<p>WHERE (satır filtresi: WLB = 1) ve HAVING (grup filtresi: en az 5 kişi) aynı sorguda birlikte. Çalışma sırası: önce WHERE, sonra GROUP BY, sonra HAVING.</p><p>İş-yaşam dengesi kötü olan Laboratory Technician\'ların %70\'i ayrılmış. Bu, ödevdeki belki de en çarpıcı tek sayı. Ama 20 kişiye dayandığını yanında söyle.</p><p>Eşiği 5 seçmek de bir karar. Eşik olmadan 1 kişilik grupta %0 ya da %100 gibi anlamsız oranlar listenin tepesine çıkabilir.</p>' },

  // ───────── F. İleri SQL Analizi ─────────
  { id: 'm27', sira: 27, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '27 · RiskScore', sirali: true,
    soru: MS('Çalışanlar için kural tabanlı bir RiskScore oluşturun.') + '<p>Kurallar (her biri puan ekler): OverTime = Yes <b>+2</b>; JobSatisfaction = 1 <b>+1</b>; EnvironmentSatisfaction = 1 <b>+1</b>; WorkLifeBalance = 1 <b>+1</b>; JobInvolvement = 1 <b>+1</b>; YearsAtCompany ≤ 2 <b>+1</b>; MonthlyIncome &lt; 3000 <b>+1</b>; StockOptionLevel = 0 <b>+1</b>. Her skor değeri için kişi sayısını ve attrition oranını göster. Beklenen çıktı: <code>RiskScore</code>, <code>calisan</code>, <code>attrition_rate</code>. Skora göre sırala.</p>',
    ipucu: 'Her kural ayrı bir <code>CASE WHEN ... THEN puan ELSE 0 END</code>, hepsini topla. Skoru bir CTE\'de hesapla, dışarıda grupla.',
    cozum: `WITH skor AS (\n  SELECT Attrition,\n         (CASE WHEN OverTime = 'Yes' THEN 2 ELSE 0 END)\n       + (CASE WHEN JobSatisfaction = 1 THEN 1 ELSE 0 END)\n       + (CASE WHEN EnvironmentSatisfaction = 1 THEN 1 ELSE 0 END)\n       + (CASE WHEN WorkLifeBalance = 1 THEN 1 ELSE 0 END)\n       + (CASE WHEN JobInvolvement = 1 THEN 1 ELSE 0 END)\n       + (CASE WHEN YearsAtCompany <= 2 THEN 1 ELSE 0 END)\n       + (CASE WHEN MonthlyIncome < 3000 THEN 1 ELSE 0 END)\n       + (CASE WHEN StockOptionLevel = 0 THEN 1 ELSE 0 END) AS RiskScore\n  FROM hr\n)\nSELECT RiskScore,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM skor\nGROUP BY RiskScore\nORDER BY RiskScore;`,
    aciklama: '<p>Kural tabanlı skor, model kurmadan önce yapılan klasik bir iş analitiği yöntemi. Kuralları ve ağırlıkları önceki soruların bulgularından seçtik: fazla mesai en güçlü sinyal olduğu için +2.</p><p>Skorun işe yarayıp yaramadığının testi bu tablo: skor arttıkça oran düzenli olarak artıyorsa kurallar anlamlı. Burada skor 0\'da oran çok düşük, yüksek skorlarda ise çalışanların çoğu ayrılmış.</p><p>Ödevde skoru hesapladıktan sonra yönetici özetinde somut bir öneriye çevirebilirsin. Örneğin: "RiskScore ≥ 5 olan 80 çalışanın yaklaşık dörtte üçü ayrılmış; aktif çalışanlar arasında bu profile uyanlar öncelikli olarak izlenmeli."</p>' },
  { id: 'm28', sira: 28, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '28 · Yaş grubu LiftScore', sirali: true,
    soru: MS('Yaş grupları için LiftScore hesaplayın: Grup Attrition Rate / Genel Attrition Rate.') + '<p>4. sorudaki yaş gruplarını kullan. Beklenen çıktı: <code>yas_grubu</code>, <code>attrition_rate</code>, <code>genel_rate</code>, <code>lift_score</code> (oran/genel, 2 ondalık). Gruba göre sırala.</p>',
    ipucu: 'Genel oranı bir CTE\'de hesapla ve CROSS JOIN ile her satıra taşı. Lift\'i yuvarlanmamış oranlarla hesapla.',
    cozum: `WITH genel AS (\n  SELECT AVG(CASE WHEN Attrition = 'Yes' THEN 1.0 ELSE 0 END) AS g FROM hr\n), grup AS (\n  SELECT CASE\n           WHEN Age < 25 THEN '18-24'\n           WHEN Age < 35 THEN '25-34'\n           WHEN Age < 45 THEN '35-44'\n           WHEN Age < 55 THEN '45-54'\n           ELSE '55+'\n         END AS yas_grubu,\n         AVG(CASE WHEN Attrition = 'Yes' THEN 1.0 ELSE 0 END) AS o\n  FROM hr\n  GROUP BY yas_grubu\n)\nSELECT yas_grubu,\n       ROUND(100 * o, 2) AS attrition_rate,\n       ROUND(100 * g, 2) AS genel_rate,\n       ROUND(o / g, 2) AS lift_score\nFROM grup CROSS JOIN genel\nORDER BY yas_grubu;`,
    aciklama: '<p><b>Lift</b> = grup oranı / genel oran. 1\'den büyükse grup ortalamadan riskli: 18-24 yaş grubunun lift\'i yaklaşık 2.4, yani bu yaş grubunda ayrılma riski şirket ortalamasının 2.4 katı. Pazarlamada ve risk modellemesinde çok kullanılan bir metrik.</p><p>Genel oranı tek satırlık bir CTE\'de hesaplayıp <code>CROSS JOIN</code> ile her satıra taşımak, "bir sabiti tüm satırlara ekleme" kalıbı. Alternatif: <code>(SELECT ... FROM hr)</code> skaler alt sorgusu.</p><p>Lift\'i yuvarlanmış yüzdeler yerine ham oranlardan hesapla. Aksi halde yuvarlama hatası ikinci ondalığı bozabilir.</p>' },
  { id: 'm29', sira: 29, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '29 · Memnuniyetin genelden farkı', sirali: true,
    soru: MS('JobSatisfaction seviyelerinin genel Attrition oranından farkını hesaplayın.') + '<p>Beklenen çıktı: <code>JobSatisfaction</code>, <code>attrition_rate</code>, <code>genel_rate</code>, <code>fark</code> (yüzde puan = oran − genel). Hepsi 2 ondalık. Seviyeye göre sırala.</p>',
    ipucu: 'Genel oranı window function ile de alabilirsin. Ama dikkat: grup oranlarının ortalaması genel oran değildir.',
    cozum: `WITH seviye AS (\n  SELECT JobSatisfaction,\n         100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS oran\n  FROM hr\n  GROUP BY JobSatisfaction\n)\nSELECT s.JobSatisfaction,\n       ROUND(s.oran, 2) AS attrition_rate,\n       ROUND(g.genel, 2) AS genel_rate,\n       ROUND(s.oran - g.genel, 2) AS fark\nFROM seviye s\nCROSS JOIN (SELECT 100.0 * AVG(CASE WHEN Attrition = 'Yes' THEN 1 ELSE 0 END) AS genel FROM hr) g\nORDER BY s.JobSatisfaction;`,
    aciklama: '<p>28. sorudaki lift <b>oran</b> verir (kaç kat?), bu soru ise <b>fark</b> verir (kaç puan?). İkisi aynı bilgiyi farklı anlatır. Yönetici özetinde "yüzde puan" ile "yüzde" karışmamalı: %22\'den %16\'ya düşüş 6 <b>puan</b>dır, %27 değil.</p><p><b>Tuzak:</b> <code>AVG(oran) OVER ()</code> ile genel oranı almak <b>yanlış</b> olur. O, 4 seviyenin oranlarının basit ortalamasıdır ve seviyelerdeki kişi sayıları farklı olduğu için gerçek genel orandan sapar. Genel oranı her zaman ham veriden hesapla.</p>' },
  { id: 'm30', sira: 30, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '30 · Üç boyutlu kırılım', sirali: true,
    soru: MS('OverTime × JobSatisfaction × WorkLifeBalance kırılımını analiz edin.') + '<p>En az 10 çalışanı olan kombinasyonlardan oranı en yüksek 10 tanesini getir. Beklenen çıktı: <code>OverTime</code>, <code>JobSatisfaction</code>, <code>WorkLifeBalance</code>, <code>calisan</code>, <code>attrition_rate</code>. Oran eşitse sırasıyla OverTime, JobSatisfaction, WorkLifeBalance\'a göre sırala.</p>',
    ipucu: 'Üç sütunla GROUP BY, <code>HAVING COUNT(*) &gt;= 10</code>, eşitliği bozan ikincil sıralama ve <code>LIMIT 10</code>.',
    cozum: `SELECT OverTime,\n       JobSatisfaction,\n       WorkLifeBalance,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM hr\nGROUP BY OverTime, JobSatisfaction, WorkLifeBalance\nHAVING COUNT(*) >= 10\nORDER BY attrition_rate DESC, OverTime, JobSatisfaction, WorkLifeBalance\nLIMIT 10;`,
    aciklama: '<p>2 × 4 × 4 = 32 kombinasyon var. Hepsini göstermek okunmaz. Küçük grupları eleyip en riskli 10\'u almak, çok boyutlu bir tabloyu yöneticiye anlatılabilir hale getirir.</p><p>10 satırın 8\'i fazla mesai yapanlar. Listeye giren iki mesaisiz grubun ikisi de iş-yaşam dengesi en kötü (1) olanlar ve hatta en üstteler. Yani denge çok kötüyse fazla mesai olmasa da risk yüksek. Fazla mesai varken ise memnuniyet ve denge hangi seviyede olursa olsun oran %30\'un üzerine çıkıyor.</p><p><b>SQL Server notu:</b> <code>LIMIT 10</code> yerine <code>SELECT TOP 10 ...</code> yazılır. Ya da sorgunun sonuna <code>OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY</code> eklenir.</p>' },
  { id: 'm31', sira: 31, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '31 · IncomeStressImpact', sirali: true,
    soru: MS('Gelir gruplarını kullanarak IncomeStressImpact analizi yapın.') + '<p>5. sorudaki gelir gruplarını kullan. Her gelir grubunda fazla mesai yapanların ve yapmayanların attrition oranını yan yana göster. <code>stress_impact</code> = mesaili oran − mesaisiz oran (yüzde puan). Beklenen çıktı: <code>gelir_grubu</code>, <code>mesaisiz_rate</code>, <code>mesaili_rate</code>, <code>stress_impact</code> (hepsi 2 ondalık). Düşük gelirden yükseğe sırala.</p>',
    ipucu: 'Koşullu ortalama: <code>AVG(CASE WHEN OverTime = \'Yes\' THEN (Attrition = \'Yes\') END)</code> gibi. ELSE yazmazsan diğer satırlar NULL olur ve AVG onları atlar.',
    cozum: `WITH t AS (\n  SELECT CASE\n           WHEN MonthlyIncome < 3000 THEN 'Düşük'\n           WHEN MonthlyIncome < 6000 THEN 'Orta'\n           WHEN MonthlyIncome < 10000 THEN 'Orta-Yüksek'\n           ELSE 'Yüksek'\n         END AS gelir_grubu,\n         MonthlyIncome,\n         OverTime,\n         CASE WHEN Attrition = 'Yes' THEN 1.0 ELSE 0 END AS ayrildi\n  FROM hr\n)\nSELECT gelir_grubu,\n       ROUND(100 * AVG(CASE WHEN OverTime = 'No'  THEN ayrildi END), 2) AS mesaisiz_rate,\n       ROUND(100 * AVG(CASE WHEN OverTime = 'Yes' THEN ayrildi END), 2) AS mesaili_rate,\n       ROUND(100 * (AVG(CASE WHEN OverTime = 'Yes' THEN ayrildi END)\n                  - AVG(CASE WHEN OverTime = 'No'  THEN ayrildi END)), 2) AS stress_impact\nFROM t\nGROUP BY gelir_grubu\nORDER BY MIN(MonthlyIncome);`,
    aciklama: '<p>"IncomeStressImpact" ödevde tanımlanmamış bir metrik. Burada mantıklı bir tanım yaptık: fazla mesainin (stres) ayrılmaya etkisi, gelir grubuna göre nasıl değişiyor?</p><p>Sonuç güçlü bir bulgu: fazla mesainin etkisi düşük gelir grubunda en büyük. Düşük gelirli bir çalışan fazla mesai yaptığında ayrılma oranı, aynı gruptaki mesaisiz çalışanın kabaca üç katına çıkıyor. Yüksek gelirde bu etki çok daha küçük. Yönetici önerisi: fazla mesai politikası düşük gelir bandında öncelikli ele alınmalı.</p><p>Teknik olarak "Ayrılan ve kalanların maaşı yan yana" sorusunda (İK Attrition, SQL) gördüğün "ELSE yazmama" kalıbı: <code>CASE WHEN OverTime = \'Yes\' THEN ayrildi END</code> mesaisizler için NULL üretir ve AVG onları atlar. Böylece tek GROUP BY\'da iki ayrı alt grubun ortalaması alınır.</p>' },
  { id: 'm32', sira: 32, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '32 · RiskFlags', sirali: true,
    soru: MS('JobSatisfaction, JobInvolvement, WorkLifeBalance, OverTime ve YearsAtCompany alanlarından RiskFlags oluşturun.') + '<p>Bayraklar (her biri 1 sayılır): JobSatisfaction ≤ 2, JobInvolvement ≤ 2, WorkLifeBalance ≤ 2, OverTime = Yes, YearsAtCompany ≤ 2. Bayrak sayısına (0-5) göre kişi sayısı ve attrition oranını göster. Beklenen çıktı: <code>bayrak_sayisi</code>, <code>calisan</code>, <code>attrition_rate</code>. Bayrak sayısına göre sırala.</p>',
    ipucu: 'Her bayrağı bir CTE\'de ayrı sütun olarak üret (1/0), sonra topla. Bayrakları ayrı sütun tutmak hangi bayrağın ne kadar yakaladığını da incelemeyi kolaylaştırır.',
    cozum: `WITH bayrak AS (\n  SELECT Attrition,\n         CASE WHEN JobSatisfaction <= 2 THEN 1 ELSE 0 END AS f_memnuniyet,\n         CASE WHEN JobInvolvement  <= 2 THEN 1 ELSE 0 END AS f_baglilik,\n         CASE WHEN WorkLifeBalance <= 2 THEN 1 ELSE 0 END AS f_denge,\n         CASE WHEN OverTime = 'Yes'     THEN 1 ELSE 0 END AS f_mesai,\n         CASE WHEN YearsAtCompany  <= 2 THEN 1 ELSE 0 END AS f_yeni\n  FROM hr\n)\nSELECT f_memnuniyet + f_baglilik + f_denge + f_mesai + f_yeni AS bayrak_sayisi,\n       COUNT(*) AS calisan,\n       ${AR} AS attrition_rate\nFROM bayrak\nGROUP BY bayrak_sayisi\nORDER BY bayrak_sayisi;`,
    aciklama: '<p>27. sorudaki RiskScore ağırlıklıydı (fazla mesai +2). RiskFlags ise eşit ağırlıklı bir sayım: "bu çalışanda kaç uyarı işareti var?". Daha basit, yöneticiye anlatması daha kolay.</p><p>0\'dan 4 bayrağa kadar oran düzenli olarak artıyor: %4, %10, %18, %34, %60. Bu "doz-yanıt" ilişkisi, bayrakların birlikte anlamlı olduğunu gösteriyor. 5 bayrakta sadece 2 kişi var. Oradaki %50 bu yüzden yorumlanamaz.</p><p>Ödev dosyasında bayrakları ayrı sütunlar olarak bir CTE ya da VIEW\'da tutman, sonraki analizlerde (örneğin "en çok hangi bayrak?") işini kolaylaştırır.</p>' },
  { id: 'm33', sira: 33, kaynak: 'miuul', dil: 'sql', seviye: 3, kategori: 'F. İleri SQL Analizi', baslik: '33 · Department × JobRole ilk 10', sirali: true,
    soru: MS('Department × JobRole bazında en yüksek Attrition oranına sahip ilk 10 kombinasyonu bulun.') + '<p>Beklenen çıktı: <code>Department</code>, <code>JobRole</code>, <code>calisan</code>, <code>attrition_rate</code>, <code>sira</code> (oran sırası, <code>RANK</code> ile). Oran eşitse Department, sonra JobRole\'e göre sırala. İlk 10 satır.</p>',
    ipucu: '<code>RANK() OVER (ORDER BY attrition_rate DESC)</code> ile sıra ver, sonra ilk 10\'u al.',
    cozum: `WITH oran AS (\n  SELECT Department, JobRole,\n         COUNT(*) AS calisan,\n         ${AR} AS attrition_rate\n  FROM hr\n  GROUP BY Department, JobRole\n)\nSELECT Department, JobRole, calisan, attrition_rate,\n       RANK() OVER (ORDER BY attrition_rate DESC) AS sira\nFROM oran\nORDER BY attrition_rate DESC, Department, JobRole\nLIMIT 10;`,
    aciklama: '<p>Ödevin F bölümündeki "window function bekleniyor" kuralı için <code>RANK()</code> burada doğal bir yer. Tie-breaker\'lı ORDER BY sonucu sabitler, LIMIT de ilk 10\'u alır.</p><p>Veride sadece 11 Department × JobRole kombinasyonu var. Çünkü çoğu rol tek bir departmana ait (Manager hariç). Yani "ilk 10" neredeyse tüm tablo. Yönetici özetinde bunu fark ettiğini göstermek iyi olur. Daha bilgilendirici bir analiz için kırılımı JobLevel ya da OverTime ile derinleştirebilirsin.</p><p><b>SQL Server notu:</b> <code>LIMIT 10</code> yerine <code>TOP 10</code>. Window function ve CTE söz dizimi SQL Server\'da aynı.</p>' }
];

// ═══════════════ Çıktı karşılaştırma ═══════════════
function nk(v) {
  if (v === null || v === undefined) return '∅';
  if (typeof v === 'boolean') return v ? '1.00' : '0.00';
  if (typeof v === 'number') { if (!isFinite(v)) return '∅'; return (Math.round(v * 100 + (v >= 0 ? 1e-7 : -1e-7)) / 100).toFixed(2); }
  let s = String(v).trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return nk(parseFloat(s));
  return s.replace(/^(\d{4}-\d{2}-\d{2})[T ]00:00:00(\.0+)?$/, '$1');
}
function karsilastir(bek, gel, sirali) {
  if (!gel || !gel.columns) return { dogru: false, mesaj: 'Çıktı yok. SQL\'de sorgunun bir SELECT ile bitmesi, Python\'da sonucun <code>sonuc</code> değişkeninde olması gerekiyor.' };

  if (bek.columns.length !== gel.columns.length) return { dogru: false, mesaj: `Sütun sayısı tutmuyor: beklenen <b>${bek.columns.length}</b> (${bek.columns.map(c => `<code>${esc(c)}</code>`).join(', ')}), senin çıktında <b>${gel.columns.length}</b>.` };
  const sutunAnahtar = (t, j) => t.rows.map(r => nk(r[j])).sort().join('\u0001');
  const bA = bek.columns.map((_, j) => sutunAnahtar(bek, j));
  const gA = gel.columns.map((_, j) => sutunAnahtar(gel, j));
  const aday = bA.map(a => gA.map((g, j) => g === a ? j : -1).filter(j => j >= 0));
  const eksik = aday.findIndex(a => a.length === 0);
  if (eksik >= 0) return { dogru: false, mesaj: `<code>${esc(bek.columns[eksik])}</code> sütununun değerleri beklenenle eşleşmiyor.` };
  const satirlar = (t, harita) => t.rows.map(r => harita.map(j => nk(r[j])).join('\u0001'));
  const bS = satirlar(bek, bek.columns.map((_, j) => j));
  let sirasiYanlis = false, deneme = 0, bulunan = null;
  const kullanildi = new Set(), harita = [];
  (function ara(i) {
    if (bulunan || deneme > 4000) return;
    if (i === aday.length) {
      deneme++;
      const gS = satirlar(gel, harita);
      if (sirali) { if (gS.every((s, k) => s === bS[k])) bulunan = [...harita]; else if ([...gS].sort().join('\n') === [...bS].sort().join('\n')) sirasiYanlis = true; }
      else if ([...gS].sort().join('\n') === [...bS].sort().join('\n')) bulunan = [...harita];
      return;
    }
    for (const j of aday[i]) { if (kullanildi.has(j)) continue; kullanildi.add(j); harita.push(j); ara(i + 1); harita.pop(); kullanildi.delete(j); }
  })(0);
  if (!bulunan) return { dogru: false, mesaj: sirasiYanlis ? 'Değerler doğru ama <b>sıralama</b> farklı. Bu soruda sıralama önemli.' : 'Sütunlar tek tek doğru görünüyor ama satırlar birbiriyle eşleşmiyor. Değerler yanlış satırlarda olabilir.' };
  const farkli = bek.columns.filter((c, i) => String(c).toLowerCase() !== String(gel.columns[bulunan[i]]).toLowerCase());
  return { dogru: true, mesaj: 'Doğru! Çıktın beklenenle aynı.' + (farkli.length ? ` <span class="kucuk">Sütun adların farklı (${farkli.map(c => `<code>${esc(c)}</code>`).join(', ')} bekleniyordu), değerler doğru.</span>` : '') };
}

function renklendir(kod, dil) {
  const re = dil === 'sql' ? /(--[^\n]*)|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g : /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(kod))) {
    if (m[1]) out += `<span class="h-yorum">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="h-metin">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="h-sayi">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (dil === 'sql' && SQL_KW.has(w.toUpperCase())) out += `<span class="h-kw">${w}</span>`;
      else if (dil === 'sql' && SQL_FN.has(w.toUpperCase())) out += `<span class="h-fn">${w}</span>`;
      else if (dil !== 'sql' && PY_KW.has(w)) out += `<span class="h-kw">${w}</span>`;
      else out += esc(w);
    } else out += esc(m[5]);
  }
  return out;
}
const kodBlok = (kod, dil) => `<pre class="kod-blok"><code>${renklendir(kod, dil)}</code></pre>`;
function hucre(v) {
  if (v === null || v === undefined) return '<td class="null">NULL</td>';
  if (typeof v === 'number') { const s = Number.isInteger(v) ? String(v) : String(+v.toFixed(4)); return `<td class="say">${s}</td>`; }
  if (typeof v === 'boolean') return `<td>${v ? 'True' : 'False'}</td>`;
  if (v === '') return '<td class="null">(boş)</td>';
  return `<td>${esc(v)}</td>`;
}
function tabloHTML(t, max = 200) {
  if (!t || !t.columns) return '';
  const satir = t.rows.slice(0, max);
  return `<div class="tablo-kap"><table class="sonuc"><thead><tr>${t.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${satir.map(r => `<tr>${r.map(hucre).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="tablo-alt">${t.total ?? t.rows.length} satır × ${t.columns.length} sütun${(t.total ?? t.rows.length) > max ? ` · ilk ${max} satır gösteriliyor` : ''}</div>`;
}
function ciktiHTML(r) {
  if (!r) return '';
  let h = '';
  if (r.stdout) h += `<div class="konsol"><div class="konsol-baslik">print çıktısı</div><pre>${esc(r.stdout)}</pre></div>`;
  if (!r.ok) h += `<div class="hata-kutu"><b>Hata</b><pre>${esc(r.error)}</pre></div>`;
  else if (r.table) h += tabloHTML(r.table);
  else if (r.mesaj) h += `<div class="bilgi">${esc(r.mesaj)}</div>`;
  if (r.ms !== undefined && r.ok) h += `<div class="sure">${r.ms} ms</div>`;
  return h;
}
function mdLite(s) {
  let h = esc(s);
  h = h.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, c) => `<pre class="kod-blok"><code>${c}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.split(/\n{2,}/).map(p => /^\s*[-•*] /m.test(p) && !p.includes('<pre') ? '<ul>' + p.split('\n').filter(Boolean).map(l => `<li>${l.replace(/^\s*[-•*] /, '')}</li>`).join('') + '</ul>' : p.includes('<pre') ? p : `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  return h;
}

// ═══════════════ Editör ═══════════════
let aktifEditor = null;
function editorKur(host, { deger = '', dil = 'sql', calistir: onRun, degisti, yukseklik = 200, yerTutucu = '' }) {
  host.innerHTML = `<div class="editor" style="--h:${yukseklik}px"><pre class="gutter" aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="${dil === 'sql' ? 'SQL sorgusu' : 'Python kodu'}"></textarea></div>`;
  const ta = $('textarea', host), gut = $('.gutter', host);
  const guncelle = () => { const n = ta.value.split('\n').length; gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n'); gut.scrollTop = ta.scrollTop; };
  const ekle = t => { ta.focus(); if (!document.execCommand('insertText', false, t)) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); } guncelle(); degisti && degisti(ta.value); };
  ta.value = deger; ta.placeholder = yerTutucu; guncelle();
  ta.addEventListener('input', () => { guncelle(); degisti && degisti(ta.value); });
  ta.addEventListener('scroll', () => { gut.scrollTop = ta.scrollTop; });
  ta.addEventListener('focus', () => { aktifEditor = api; });
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ekle('    '); return; }
    if (e.key === 'Tab' && e.shiftKey) {
      e.preventDefault(); const bas = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
      const bosluk = (ta.value.slice(bas).match(/^ {1,4}/) || [''])[0].length;
      if (bosluk) { const s = ta.selectionStart; ta.setSelectionRange(bas, bas + bosluk); document.execCommand('delete') || ta.setRangeText('', bas, bas + bosluk); ta.setSelectionRange(Math.max(bas, s - bosluk), Math.max(bas, s - bosluk)); guncelle(); }
      return;
    }
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      const bas = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
      const satir = ta.value.slice(bas, ta.selectionStart);
      let girinti = (satir.match(/^\s*/) || [''])[0];
      if (dil === 'python' && /:\s*$/.test(satir)) girinti += '    ';
      if (girinti) { e.preventDefault(); ekle('\n' + girinti); }
    }
  });
  const api = { get: () => ta.value, set: v => { ta.value = v; guncelle(); degisti && degisti(v); }, ekle, odak: () => ta.focus(), dil };
  aktifEditor = api;
  return api;
}

const azHareket = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function listedeGoster(kap, el) {
  if (!kap || !el) return;
  const k = kap.getBoundingClientRect(), r = el.getBoundingClientRect();
  if (r.top < k.top) kap.scrollTop -= (k.top - r.top) + 8;
  else if (r.bottom > k.bottom) kap.scrollTop += (r.bottom - k.bottom) + 8;
}
function calismaAlaninaGit(c) {

  const dar = window.matchMedia('(max-width: 820px)').matches;

    for (const sn of wb.SheetNames) {

      let baslik = ham[0].map((h, i) => adTemizle(h, `sutun_${i + 1}`));
      const gor = {}; baslik = baslik.map(h => { if (gor[h]) { gor[h]++; return `${h}_${gor[h]}`; } gor[h] = 1; return h; });

      const tipler = baslik.map((_, i) => { const dolu = satirlar.map(r => r[i]).filter(v => v !== null); if (!dolu.length) return 'TEXT'; if (dolu.every(v => typeof v === 'number')) return dolu.every(Number.isInteger) ? 'INTEGER' : 'REAL'; return 'TEXT'; });
      satirlar = satirlar.map(r => r.map((v, i) => tipler[i] === 'TEXT' && v !== null ? String(v) : v));
      let tad = adTemizle(wb.SheetNames.length === 1 && /\.csv$/i.test(f.name) ? f.name.replace(/\.[^.]+$/, '') : sn, 'tablo');
      while (tablolar[tad]) tad += '_2';
      tablolar[tad] = { columns: baslik, types: tipler, rows: satirlar };
    }
    if (!Object.keys(tablolar).length) throw new Error('Dosyada okunabilir bir tablo bulunamadı. İlk satırın sütun adları olduğundan emin ol.');
    VS.yuklenen = { ad: f.name.replace(/\.[^.]+$/, ''), tablolar, sorular: [], meta: metaHesapla(tablolar) };
    delete dbCache.yuklenen; Object.keys(beklenenCache).filter(k => k.startsWith('yuklenen:')).forEach(k => delete beklenenCache[k]);
    if (pyYukluVS === 'yuklenen') pyYukluVS = null;
    S.aktifId.yuklenen = null;
    S.gecmis = S.gecmis.filter(g => g.vs !== 'yuklenen');
    await sqlHazir; dbAl('yuklenen');
    S.veriSeti = 'yuklenen';
    S.serbestKod = varsayilanKod('yuklenen');
    yenidenCiz();
    if (uyarilar.length) $('#yukDurum').innerHTML = `<div class="bilgi">${uyarilar.map(esc).join('<br>')}</div>`;
  } catch (e) { d.innerHTML = `<div class="hata-kutu">Dosya okunamadı: ${esc(e.message || e)}</div>`; }
}
function veriOzetiPrompt(tablolar) {
  return Object.entries(tablolar).map(([ad, t]) => {
    const sut = t.columns.map((c, i) => {
      const deg = t.rows.map(r => r[i]); const dolu = deg.filter(v => v !== null);
      let ek = `boş: ${deg.length - dolu.length}`;
      if (t.types[i] !== 'TEXT' && dolu.length) ek += `, min: ${Math.min(...dolu)}, max: ${Math.max(...dolu)}`;
      else { const farkli = [...new Set(dolu)]; ek += `, farklı değer: ${farkli.length}${farkli.length <= 12 ? ` (${farkli.slice(0, 12).join(' / ')})` : `, örnek: ${farkli.slice(0, 4).join(' / ')}`}`; }
      return `  - ${c} ${t.types[i]} [${ek}]`;
    }).join('\n');
    return `Tablo: ${ad} (${t.rows.length} satır)\n${sut}\nİlk 4 satır:\n${t.rows.slice(0, 4).map(r => '  ' + JSON.stringify(r)).join('\n')}`;
  }).join('\n\n');
}
async function soruUret(dil, adet) {
  const Y = VS.yuklenen; if (!Y || S.uretiliyor) return;
  S.uretiliyor = true; const durum = () => $('#uretDurum');
  const btn = $('#uretForm button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = 'Üretiliyor…'; }
  durum().innerHTML = '<div class="yukleniyor">Claude veriyi inceleyip soruları hazırlıyor. Bu 30-60 saniye sürebilir…</div>';
  const dilMetni = dil === 'ikisi' ? `yaklaşık yarısı SQL, yarısı Python (pandas)` : dil === 'sql' ? 'hepsi SQL' : 'hepsi Python (pandas)';
  const mevcut = Y.sorular.map(q => `- ${q.baslik}`).join('\n');
  const prompt = `Bir veri analistinin SQL ve Python pratiği yapması için alıştırma soruları hazırlıyorsun. Tüm metinler Türkçe olsun.

VERİ:
${veriOzetiPrompt(Y.tablolar)}

KURALLAR:
- Toplam ${adet} soru üret, ${dilMetni}. Kolaydan zora sırala: yaklaşık üçte biri seviye 1 (temel SELECT/filtre/sıralama), üçte biri seviye 2 (GROUP BY, JOIN, CASE, tarih), üçte biri seviye 3 (window function, CTE, alt sorgu; pandas'ta merge, pivot_table, transform, rank).
- SQL çözümleri SQLite lehçesinde olmalı (tarih için strftime/julianday, QUALIFY yok). Tablo ve sütun adlarını aynen kullan.
- Python çözümlerinde her tablo aynı isimde bir pandas DataFrame olarak hazır; pd ve np import edilmiş. YYYY-MM-DD formatındaki tarih sütunları datetime tipinde gelir. Sonuç mutlaka \`sonuc\` değişkenine atanmalı.
- Her soru gerçek bir iş sorusu gibi olsun, verinin anlamına uygun olsun.
- Soru metninde beklenen sütun adlarını <code>...</code> ile belirt, yuvarlama gerekiyorsa söyle (örn. 2 ondalık).
- Sonuç boş olmamalı, deterministik olmalı. Sıralama önemliyse sirali=true yap ve eşitliği bozacak ikinci bir sıralama kriteri ekle.
- Tablolar arasında JOIN için ortak anahtar yoksa JOIN sorusu üretme.
- aciklama alanı öğretici olsun: sorgunun neden böyle yazıldığını, adımların mantığını ve sık yapılan hatayı anlat (2-4 kısa paragraf). HTML olarak <p>, <ul>, <li>, <code>, <b> kullan.
${mevcut ? `- Şu sorular zaten var, bunları tekrar etme:\n${mevcut}` : ''}

Sadece şu JSON'u döndür:
{"sorular":[{"dil":"sql"|"python","seviye":1|2|3,"kategori":"kısa kategori adı","baslik":"kısa başlık","soru":"soru metni (HTML: <code> kullanılabilir)","ipucu":"tek cümlelik ipucu","cozum":"çalışan çözüm kodu","aciklama":"HTML açıklama","sirali":true|false}]}`;
  try {
    const r = await claudeJson(prompt, { modelTier: 'complex' });
    const gelen = (r && r.sorular) || (Array.isArray(r) ? r : []);
    if (!gelen.length) throw new Error('Claude geçerli bir soru listesi döndürmedi. Tekrar dene.');
    durum().innerHTML = `<div class="yukleniyor">${gelen.length} soru geldi. Çözümler veride çalıştırılarak doğrulanıyor…</div>`;
    const onceki = S.veriSeti; S.veriSeti = 'yuklenen';
    const tag = Date.now().toString(36);
    const gecen = [], elenen = [];
    for (const [i, q0] of gelen.entries()) {
      const q = { id: `u${tag}_${i}`, dil: q0.dil === 'python' ? 'python' : 'sql', seviye: [1, 2, 3].includes(+q0.seviye) ? +q0.seviye : 2, kategori: String(q0.kategori || 'Genel'), baslik: String(q0.baslik || `Soru ${i + 1}`), soru: String(q0.soru || ''), ipucu: String(q0.ipucu || ''), cozum: String(q0.cozum || ''), aciklama: String(q0.aciklama || ''), sirali: !!q0.sirali };
      if (!q.cozum || !q.soru) { elenen.push(q.baslik); continue; }
      try {
        if (q.dil === 'python') durum().innerHTML = `<div class="yukleniyor">Python soruları doğrulanıyor${pyDurum !== 'hazir' ? ' (Python ortamı hazırlanıyor)' : ''}…</div>`;
        await bekle(10);
        const sonuc = await calistir(q.dil, q.cozum, true);
        if (sonuc.ok && sonuc.table && sonuc.table.rows.length) { beklenenCache['yuklenen:' + q.id] = sonuc; gecen.push(q); } else elenen.push(q.baslik);
      } catch (e) { elenen.push(q.baslik); }
    }
    S.veriSeti = onceki;
    Y.sorular.push(...gecen);
    S.uretiliyor = false;
    if (S.view === 'veri') veriCiz();
    ustCiz();
    const d = durum();
    if (d) d.innerHTML = `<div class="karar ${gecen.length ? 'dogru' : 'yanlis'}"><span class="karar-ikon">${gecen.length ? '✓' : '✕'}</span><div>${gecen.length} soru eklendi.${elenen.length ? ` ${elenen.length} tanesinin çözümü veride çalışmadığı için elendi.` : ''} ${gecen.length ? '<button class="btn kucuk-btn" data-git="alistirma">Alıştırmalara git</button>' : ''}</div></div>`;
    $$('[data-git]').forEach(b => b.onclick = () => { if (S.veriSeti !== 'yuklenen') S.veriSeti = 'yuklenen'; S.filtre = { dil: gecen[0] ? gecen[0].dil : 'sql', seviye: 0, kategori: '' }; git(b.dataset.git); });
  } catch (e) {
    S.uretiliyor = false;
    if (S.view === 'veri') veriCiz();
    const d = durum(); if (d) d.innerHTML = `<div class="hata-kutu">${esc(claudeHata(e))}</div>`;
  }
}

// ─── Başlat ───
(function baslat() {
  const v = location.hash.slice(1);
  if (VIEWLER.includes(v)) S.view = v;
  veriHazirla(S.veriSeti).catch(() => { });
  yenidenCiz();
  sqlHazir.then(() => { if (!SQLlib) { $('#ana').insertAdjacentHTML('afterbegin', '<div class="hata-kutu">SQL motoru yüklenemedi. Sayfayı yenilemeyi dene.</div>'); } });
})();
